<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KCD2-Synced</title>
    <!--
  KCDS in-game server browser: the user's "redesigned server panel" design with all of
  its frames (Launcher, State-Loading, State-ListOffline, State-Empty and the popups Connecting,
  ConnectFailed, ConfirmQueue, InQueue, UpdateRequired, Disconnected) and its design manual. The
  1600x900 reference layout is scaled to the game window; the top stays transparent so the game's
  main-menu scene and our logo show through.

  In game the page runs in the client's CEF view (Client/ui/compositor, Client/ui/web) and talks
  to kcd2s::platform::MenuSession over the "kcds:menu" channel (see menu_session.hpp for every
  message):
    game -> page : CustomEvent "kcds:menu", detail {type, ...}   "self", "servers", "state"
    page -> game : sendToGame("kcds:menu", JSON {type, ...})     ready, refresh, connect, direct,
                                                                cancel, update, quit, dismiss, tool
  Outside the game the same messages use the NUI bridge (window "message" events in,
  fetch("https://kcd2s-menu/<cb>") out); without any bridge, sample data is shown for design
  preview. Sample data never appears in game.

  Everything that comes from a server or the master (names, reasons, queue fields) is rendered as
  text, never as markup. Fonts: Cinzel and EB Garamond ship in fonts/ (SIL OFL).
-->
    <link rel="stylesheet" href="fonts/fonts.css" />
    <style>
      :root {
        --night: #0d0b08;
        --gold: #d9b56c;
        --gold-hover: #ecca82;
        --gold-light: #e4c27a;
        --gold-muted: #c9a45c;
        --gold-pale: #f3dba3;
        --parchment: #f6edd8;
        --body: #ece3cf;
        --muted: #a99c82;
        --soft: #c2b597;
        --text: #d9cfb8;
        --healthy: #9cbc6c;
        --busy: #e0ac55;
        --amber: #e9b968;
        --danger: #d0705a;
        --danger-light: #e8907a;
        --serif-display: Cinzel, Georgia, serif;
        --serif-text: 'EB Garamond', Georgia, 'Times New Roman', serif;
        --mono: ui-monospace, Consolas, monospace;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      html.preview body {
        background: var(--night);
      }
      button {
        font: inherit;
      }
      input::placeholder {
        color: #9a8e77;
      }
      :focus {
        outline: none;
      }
      :focus-visible {
        outline: 2px solid var(--parchment);
        outline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
      @keyframes klshimmer {
        0% {
          background-position: -300px 0;
        }
        100% {
          background-position: 300px 0;
        }
      }
      @keyframes klspin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes klbar {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      .skel {
        background: linear-gradient(
          90deg,
          rgba(255, 240, 210, 0.05) 0%,
          rgba(255, 240, 210, 0.13) 50%,
          rgba(255, 240, 210, 0.05) 100%
        );
        background-size: 600px 100%;
        animation: klshimmer 1.6s linear infinite;
      }
      .spin {
        animation: klspin 1.1s linear infinite;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }

      /* ---- stage: the 1600x900 reference, scaled to the window height ---------------------------- */
      .stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1600px;
        height: 900px;
        transform-origin: 0 0;
        overflow: hidden;
        font-family: var(--serif-text);
        color: var(--body);
      }
      .bottom-fade {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 460px;
        background: linear-gradient(0deg, rgba(8, 6, 4, 0.75), rgba(8, 6, 4, 0));
      }

      /* ---- glass panel ----------------------------------------------------------------------------- */
      .panel {
        position: absolute;
        left: 40px;
        right: 40px;
        bottom: 40px;
        height: 352px;
        box-sizing: border-box;
        padding: 24px;
        display: flex;
        gap: 28px;
        background: rgba(12, 10, 7, 0.48);
        backdrop-filter: blur(18px) saturate(1.1);
        -webkit-backdrop-filter: blur(18px) saturate(1.1);
        border: 1px solid rgba(201, 164, 92, 0.3);
        border-radius: 8px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
      }

      /* ---- left column ------------------------------------------------------------------------------ */
      .detail {
        width: 360px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .detail-top {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .detail-top.loading {
        gap: 10px;
      }
      .eyebrow {
        font-family: var(--serif-display);
        font-size: 11px;
        letter-spacing: 4px;
        color: var(--gold-muted);
      }
      .selname {
        margin: 0;
        font-family: var(--serif-display);
        font-weight: 700;
        font-size: 30px;
        line-height: 1.15;
        color: var(--parchment);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .nochoice-title {
        margin: 0;
        font-family: var(--serif-display);
        font-weight: 700;
        font-size: 26px;
        line-height: 1.2;
        color: var(--parchment);
      }
      .nochoice-text {
        font-size: 16px;
        line-height: 1.45;
        color: var(--soft);
      }
      .selstat {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
        color: #d2c6aa;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #6f6552;
      }
      .num {
        font-family: var(--serif-display);
        font-weight: 600;
        color: var(--parchment);
      }
      .selhost {
        font-size: 15px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .ride {
        height: 58px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: var(--gold);
        color: #1a140b;
        border: 1px solid var(--gold-pale);
        border-radius: 5px;
        box-shadow: 0 0 0 4px rgba(217, 181, 108, 0.16), 0 8px 24px rgba(0, 0, 0, 0.45);
        font-family: var(--serif-display);
        font-weight: 700;
        font-size: 19px;
        letter-spacing: 4px;
        cursor: pointer;
      }
      .ride:hover {
        background: var(--gold-hover);
      }
      .ride:disabled {
        background: rgba(217, 181, 108, 0.18);
        color: rgba(246, 237, 216, 0.55);
        border-color: rgba(217, 181, 108, 0.3);
        box-shadow: none;
        cursor: not-allowed;
      }
      .ride.busy,
      .ride.busy:disabled {
        background: var(--gold);
        color: #1a140b;
        border-color: var(--gold-pale);
        cursor: progress;
      }
      .busy-ring {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid rgba(26, 20, 11, 0.25);
        border-top-color: #1a140b;
        box-sizing: border-box;
      }
      .direct-row {
        display: flex;
        gap: 8px;
      }
      .field {
        flex-grow: 1;
        min-width: 0;
        height: 36px;
        box-sizing: border-box;
        padding: 0 12px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(201, 164, 92, 0.22);
        border-radius: 4px;
        color: var(--body);
        font-family: var(--serif-text);
        font-size: 15px;
        outline: none;
      }
      .field:focus {
        border-color: rgba(228, 194, 122, 0.8);
      }
      /* The bug report dialog over the game world (the ESC menu's Report a bug): only the dialog. */
      .stage.over-world > :not(.scrim) {
        visibility: hidden;
      }
      .bugtext {
        display: block;
        width: 100%;
        height: auto;
        min-height: 120px;
        padding: 10px 12px;
        resize: vertical;
        line-height: 1.4;
      }
      .bugagree {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin-top: 12px;
        color: var(--body);
        font-family: var(--serif-text);
        font-size: 15px;
        cursor: pointer;
      }
      .bugagree input {
        margin-top: 3px;
        accent-color: var(--gold);
      }
      .bugnote {
        margin-top: 12px;
        font-size: 13px;
        opacity: 0.8;
      }
      .field.error {
        border-color: var(--danger);
      }
      .field-error {
        font-size: 14px;
        color: var(--danger-light);
        margin-top: -4px;
      }
      .ico {
        height: 36px;
        background: transparent;
        border: 1px solid rgba(201, 164, 92, 0.4);
        border-radius: 4px;
        color: var(--gold-light);
        font-family: var(--serif-display);
        font-size: 11px;
        letter-spacing: 2px;
        cursor: pointer;
      }
      .ico:hover {
        border-color: var(--gold-light);
        color: var(--gold-pale);
      }
      .join {
        padding: 0 14px;
      }
      .localhost {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: rgba(0, 0, 0, 0.25);
        border: 1px dashed rgba(201, 164, 92, 0.45);
      }
      .divider {
        width: 1px;
        flex-shrink: 0;
        background: rgba(201, 164, 92, 0.25);
      }

      /* ---- right column ----------------------------------------------------------------------------- */
      .realms {
        flex-grow: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .realms-head {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .realms-head .eyebrow {
        flex-grow: 1;
      }
      .refresh {
        width: 38px;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(201, 164, 92, 0.35);
        border-radius: 50%;
        padding: 0;
        flex-shrink: 0;
      }
      .refresh .icon {
        display: flex;
      }
      .refresh.spinning .icon {
        animation: klspin 1.1s linear infinite;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 220px;
        height: 38px;
        padding: 0 12px;
        box-sizing: border-box;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(201, 164, 92, 0.28);
        border-radius: 19px;
      }
      .search.dim {
        opacity: 0.5;
      }
      .search:focus-within {
        border-color: rgba(228, 194, 122, 0.8);
      }
      .search input {
        flex-grow: 1;
        min-width: 0;
        background: transparent;
        border: 0;
        outline: none;
        color: var(--body);
        font-family: var(--serif-text);
        font-size: 16px;
      }
      .clear {
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: 0;
        color: var(--gold-muted);
        cursor: pointer;
        padding: 0;
      }
      .fetching {
        display: flex;
        align-items: center;
        gap: 10px;
        font-style: italic;
        font-size: 16px;
        color: var(--soft);
      }
      .ring {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid rgba(228, 194, 122, 0.25);
        border-top-color: var(--gold-light);
        box-sizing: border-box;
      }
      .strip {
        flex-grow: 1;
        min-height: 0;
        display: flex;
        gap: 12px;
        align-items: flex-start;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        padding-bottom: 6px;
      }
      .strip.loading {
        overflow: hidden;
      }
      .strip.blocked {
        align-items: stretch;
        overflow: hidden;
      }
      .strip::-webkit-scrollbar {
        height: 4px;
      }
      .strip::-webkit-scrollbar-thumb {
        background: rgba(201, 164, 92, 0.45);
        border-radius: 2px;
      }
      .skel-card {
        width: 148px;
        height: 240px;
        flex-shrink: 0;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .no-match {
        flex-grow: 1;
        align-self: center;
        text-align: center;
        font-style: italic;
        font-size: 18px;
        color: #c2b597;
      }

      /* ---- list blocks: unavailable and empty ------------------------------------------------------- */
      .block {
        flex-grow: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px dashed rgba(201, 164, 92, 0.3);
        border-radius: 6px;
      }
      .block.offline {
        border-color: rgba(208, 112, 90, 0.4);
        background: rgba(60, 20, 12, 0.18);
      }
      .block-inner {
        display: flex;
        align-items: center;
        gap: 24px;
        max-width: 640px;
      }
      .block-icon {
        width: 72px;
        height: 72px;
        flex-shrink: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(217, 181, 108, 0.1);
        border: 1px solid rgba(217, 181, 108, 0.45);
        color: var(--gold-light);
      }
      .block.offline .block-icon {
        background: rgba(208, 112, 90, 0.14);
        border-color: rgba(208, 112, 90, 0.6);
        color: var(--danger-light);
      }
      .block-text {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .block-eyebrow {
        font-family: var(--serif-display);
        font-size: 11px;
        letter-spacing: 4px;
        color: var(--danger-light);
      }
      .block-title {
        font-family: var(--serif-display);
        font-weight: 700;
        font-size: 24px;
        color: var(--parchment);
      }
      .block-body {
        font-size: 17px;
        line-height: 1.45;
        color: var(--soft);
      }
      .block-body .em {
        color: var(--parchment);
      }
      .block-actions {
        display: flex;
        gap: 10px;
        margin-top: 6px;
        align-items: center;
      }
      .linkish {
        height: 48px;
        padding: 0 12px;
        background: transparent;
        border: 0;
        color: var(--muted);
        font-family: var(--serif-text);
        font-size: 16px;
        text-decoration: underline;
        cursor: pointer;
      }
      .code {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--muted);
        padding: 10px 12px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(208, 112, 90, 0.25);
        border-radius: 4px;
        overflow-wrap: anywhere;
      }

      /* ---- server card ------------------------------------------------------------------------------ */
      .card {
        position: relative;
        overflow: hidden;
        width: 148px;
        height: 240px;
        flex-shrink: 0;
        scroll-snap-align: start;
        padding: 0;
        cursor: pointer;
        border-radius: 6px;
        color: inherit;
        background: #1a150f;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: border-color 0.35s ease;
      }
      .card[aria-pressed='true'] {
        border-color: var(--gold-light);
      }
      /* Selection (design 164c): dimmed, desaturated art that comes to full colour and zooms in, an
         inner gold frame and four corner brackets sliding in. */
      .card .art {
        filter: grayscale(0.7) brightness(0.58);
        transform: scale(1);
        transition: filter 0.45s ease, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .card:not([aria-pressed='true']):hover .art {
        filter: grayscale(0.25) brightness(0.85);
      }
      .card[aria-pressed='true'] .art {
        filter: none;
        transform: scale(1.07);
      }
      .card .frame {
        position: absolute;
        inset: 5px;
        border: 1px solid rgba(228, 194, 122, 0.85);
        border-radius: 3px;
        pointer-events: none;
        opacity: 0;
        transform: scale(1.05);
        transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .card[aria-pressed='true'] .frame {
        opacity: 1;
        transform: scale(1);
      }
      .corner {
        position: absolute;
        width: 16px;
        height: 16px;
        border: 0 solid #f3d38e;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease, transform 0.5s cubic-bezier(0.2, 0.9, 0.25, 1.15);
      }
      .corner.tl {
        left: 3px;
        top: 3px;
        border-left-width: 2px;
        border-top-width: 2px;
        transform: translate(-8px, -8px);
      }
      .corner.tr {
        right: 3px;
        top: 3px;
        border-right-width: 2px;
        border-top-width: 2px;
        transform: translate(8px, -8px);
      }
      .corner.bl {
        left: 3px;
        bottom: 7px;
        border-left-width: 2px;
        border-bottom-width: 2px;
        transform: translate(-8px, 8px);
      }
      .corner.br {
        right: 3px;
        bottom: 7px;
        border-right-width: 2px;
        border-bottom-width: 2px;
        transform: translate(8px, 8px);
      }
      .card[aria-pressed='true'] .corner {
        opacity: 1;
        transform: translate(0, 0);
      }
      .art,
      .art img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .card .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          0deg,
          rgba(8, 6, 4, 0.92) 0%,
          rgba(8, 6, 4, 0.55) 38%,
          rgba(8, 6, 4, 0) 62%
        );
      }
      .card .full {
        position: absolute;
        left: 10px;
        top: 10px;
        padding: 2px 7px;
        border-radius: 2px;
        background: rgba(140, 36, 24, 0.92);
        color: #fbe6dc;
        font-family: var(--serif-display);
        font-size: 10px;
        letter-spacing: 1.5px;
      }
      .card .full.locked {
        background: rgba(60, 46, 24, 0.92);
        color: #f3e3bf;
      }
      .card .meta {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        text-align: left;
      }
      .card .cname {
        font-family: var(--serif-display);
        font-weight: 600;
        font-size: 14px;
        line-height: 1.2;
        color: #d9cfb8;
        transition: color 0.35s ease;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .card[aria-pressed='true'] .cname {
        color: #f6e3b4;
      }
      .card .cpop {
        font-size: 14px;
        color: #cfc3a8;
      }
      .barbg {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 4px;
        background: rgba(255, 255, 255, 0.12);
      }
      .bar {
        height: 4px;
      }

      .footer {
        position: absolute;
        right: 44px;
        bottom: 14px;
        font-size: 12px;
        color: rgba(236, 227, 207, 0.5);
      }

      /* ---- buttons (design manual 03) ------------------------------------------------------------- */
      .btn {
        height: 48px;
        padding: 0 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border-radius: 5px;
        font-family: var(--serif-display);
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 2.5px;
        cursor: pointer;
      }
      .btn.primary {
        background: var(--gold);
        color: #1a140b;
        border: 1px solid var(--gold-pale);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      }
      .btn.primary:hover {
        background: var(--gold-hover);
      }
      .btn.secondary {
        background: rgba(0, 0, 0, 0.25);
        color: var(--gold-light);
        border: 1px solid rgba(201, 164, 92, 0.5);
      }
      .btn.secondary:hover {
        border-color: var(--gold-light);
      }
      .btn.danger {
        background: #b04a36;
        color: #fff3ee;
        border: 1px solid #e8907a;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      }
      .btn.danger:hover {
        background: #c2563f;
      }
      .exit-warn {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 12px 14px;
        background: rgba(224, 172, 85, 0.08);
        border: 1px solid rgba(224, 172, 85, 0.35);
        border-radius: 6px;
      }
      .exit-warn-icon {
        display: flex;
        margin-top: 2px;
        color: #e9b968;
      }
      .exit-warn-lines {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .exit-warn-title {
        font-size: 17px;
        color: #f6edd8;
      }
      .exit-warn-note {
        font-size: 15px;
        color: #a99c82;
      }
      .head-divider {
        width: 1px;
        height: 24px;
        flex-shrink: 0;
        background: rgba(201, 164, 92, 0.3);
      }
      .exit-game {
        height: 38px;
        padding: 0 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
        white-space: nowrap;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(201, 164, 92, 0.35);
        border-radius: 19px;
        color: var(--gold-light);
        font-family: Cinzel, serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 2px;
        cursor: pointer;
      }
      .exit-game:hover,
      .exit-game:focus-visible {
        border-color: #d0705a;
        color: #f0a08c;
        background: rgba(120, 30, 20, 0.3);
      }
      /* The tools: ANIM / ASSETS and WORLD ARCHITECT start the game again in them. */
      .tool {
        height: 38px;
        padding: 0 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
        white-space: nowrap;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(201, 164, 92, 0.35);
        border-radius: 19px;
        color: var(--gold-light);
        font-family: Cinzel, serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1.5px;
        cursor: pointer;
      }
      .tool:hover,
      .tool:focus-visible {
        border-color: var(--gold-light);
        color: var(--gold-pale);
        background: rgba(201, 164, 92, 0.12);
      }
      .btn.ghost {
        background: transparent;
        color: #cfc3a8;
        border: 1px solid transparent;
      }
      .btn.ghost:hover {
        border-color: rgba(201, 164, 92, 0.4);
      }
      .btn:disabled {
        background: rgba(217, 181, 108, 0.18);
        color: rgba(246, 237, 216, 0.5);
        border: 1px solid rgba(217, 181, 108, 0.3);
        box-shadow: none;
        cursor: not-allowed;
      }

      /* ---- popups (design manual 06, 07) ---------------------------------------------------------- */
      .scrim {
        position: absolute;
        inset: 0;
        background: rgba(6, 5, 3, 0.62);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dialog {
        position: relative;
        width: 540px;
        box-sizing: border-box;
        padding: 32px 32px 26px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        background: rgba(18, 15, 11, 0.94);
        border: 1px solid rgba(201, 164, 92, 0.45);
        border-radius: 8px;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 240, 210, 0.06);
      }
      .close {
        position: absolute;
        right: 14px;
        top: 14px;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: 0;
        color: var(--muted);
        cursor: pointer;
        padding: 0;
      }
      .dhead {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .medallion {
        width: 56px;
        height: 56px;
        flex-shrink: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(217, 181, 108, 0.14);
        border: 1px solid rgba(217, 181, 108, 0.55);
        color: var(--gold-light);
      }
      .medallion.amber {
        background: rgba(224, 172, 85, 0.14);
        border-color: rgba(224, 172, 85, 0.6);
        color: var(--amber);
      }
      .medallion.red {
        background: rgba(208, 112, 90, 0.14);
        border-color: rgba(208, 112, 90, 0.6);
        color: var(--danger-light);
      }
      .dtitles {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .deyebrow {
        font-family: var(--serif-display);
        font-size: 11px;
        letter-spacing: 4px;
        color: var(--gold-light);
      }
      .deyebrow.amber {
        color: var(--amber);
      }
      .deyebrow.red {
        color: var(--danger-light);
      }
      .dtitle {
        margin: 0;
        font-family: var(--serif-display);
        font-weight: 700;
        font-size: 24px;
        line-height: 1.2;
        color: var(--parchment);
      }
      .dbody {
        margin: 0;
        font-size: 18px;
        line-height: 1.5;
        color: var(--text);
      }
      .dbody .em {
        color: var(--parchment);
      }
      .dnote {
        font-size: 16px;
        color: var(--muted);
      }
      .dfoot {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 10px;
        border-top: 1px solid rgba(201, 164, 92, 0.18);
        padding-top: 18px;
      }
      .dfoot .linkish {
        margin-right: auto;
        padding: 0;
      }
      .server-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px;
        background: rgba(0, 0, 0, 0.28);
        border: 1px solid rgba(201, 164, 92, 0.2);
        border-radius: 6px;
      }
      .thumb {
        position: relative;
        overflow: hidden;
        width: 64px;
        height: 44px;
        flex-shrink: 0;
        border-radius: 3px;
        border: 1px solid rgba(201, 164, 92, 0.35);
      }
      .row-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex-grow: 1;
        min-width: 0;
      }
      .row-name {
        font-family: var(--serif-display);
        font-weight: 600;
        font-size: 15px;
        color: var(--parchment);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row-host {
        font-size: 14px;
        color: var(--muted);
      }
      .row-pop {
        font-size: 15px;
        color: #cfc3a8;
        white-space: nowrap;
      }
      .steps {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 17px;
        color: #cfc3a8;
      }
      .step.active {
        color: var(--parchment);
      }
      .step.waiting {
        color: #8a7f6b;
      }
      .step.failed {
        color: var(--danger-light);
      }
      .tick,
      .cross {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(156, 188, 108, 0.18);
        color: var(--healthy);
      }
      .cross {
        background: rgba(208, 112, 90, 0.18);
        color: var(--danger-light);
      }
      .step-ring {
        width: 18px;
        height: 18px;
        margin: 2px;
        border-radius: 50%;
        border: 2px solid rgba(228, 194, 122, 0.25);
        border-top-color: var(--gold-light);
        box-sizing: border-box;
      }
      .step-dot {
        width: 8px;
        height: 8px;
        margin: 7px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
      }
      .progress {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .track {
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .slide {
        height: 6px;
        width: 40%;
        background: var(--gold);
        border-radius: 3px;
        animation: klbar 1.4s ease-in-out infinite;
      }
      .fill {
        height: 6px;
        background: var(--gold);
        border-radius: 3px;
        box-shadow: 0 0 12px rgba(217, 181, 108, 0.5);
        transition: width 0.2s linear;
      }
      .progress-text {
        display: flex;
        justify-content: space-between;
        font-size: 15px;
        color: var(--muted);
      }
      .check {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 17px;
        color: var(--text);
        cursor: pointer;
      }
      .check input {
        width: 20px;
        height: 20px;
        accent-color: var(--gold);
      }
      .queue-figures {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
        padding: 18px 0;
        border-top: 1px solid rgba(201, 164, 92, 0.15);
        border-bottom: 1px solid rgba(201, 164, 92, 0.15);
      }
      .figure {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      .figure .value {
        font-family: var(--serif-display);
        font-weight: 700;
        font-size: 44px;
        color: var(--parchment);
        line-height: 1;
      }
      .figure .label {
        font-size: 15px;
        color: var(--muted);
      }
      .figure-sep {
        width: 1px;
        height: 56px;
        background: rgba(201, 164, 92, 0.25);
      }
      .fields {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 16px;
      }
      .fields .field-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      .fields .field-label {
        color: var(--muted);
      }
      .fields .field-value {
        color: var(--body);
        text-align: right;
        overflow-wrap: anywhere;
      }
      .versions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .version-card {
        padding: 12px;
        background: rgba(0, 0, 0, 0.28);
        border: 1px solid rgba(201, 164, 92, 0.2);
        border-radius: 6px;
      }
      .version-card.required {
        background: rgba(217, 181, 108, 0.08);
        border-color: rgba(217, 181, 108, 0.4);
      }
      .version-card .label {
        font-size: 14px;
        color: var(--muted);
      }
      .version-card .value {
        font-family: var(--serif-display);
        font-weight: 600;
        font-size: 18px;
        color: var(--parchment);
      }
      .version-card.required .value {
        color: var(--gold-light);
      }
      .reason-box {
        padding: 12px 14px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(208, 112, 90, 0.3);
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .reason-box .label {
        font-family: var(--serif-display);
        font-size: 11px;
        letter-spacing: 3px;
        color: var(--danger-light);
      }
      .reason-box .value {
        font-size: 17px;
        color: var(--body);
      }
      @media (prefers-reduced-motion: reduce) {
        .skel,
        .spin,
        .slide,
        .refresh.spinning .icon {
          animation: none;
        }
        .card,
        .card .art,
        .card .frame,
        .corner,
        .card .cname {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="bottom-fade" aria-hidden="true"></div>

      <section class="panel" aria-label="Server selection">
        <div class="detail">
          <div class="detail-top" id="detail-top"></div>
          <div class="actions">
            <button type="button" class="ride" id="connect" disabled>
              <span class="busy-ring spin" id="ride-busy" hidden></span>
              <span id="ridelabel">CONNECT</span>
              <svg
                id="ride-arrow"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 12h14M13 6l6 6-6 6" />
              </svg>
            </button>
            <div class="direct-row">
              <label for="direct" class="sr-only">Direct connect</label>
              <input
                id="direct"
                class="field"
                type="text"
                placeholder="Direct connect — host:port"
                autocomplete="off"
                spellcheck="false"
              />
              <button type="button" class="ico join" id="directbtn">JOIN</button>
            </div>
            <div class="field-error" id="direct-error" hidden></div>
            <button type="button" class="ico localhost" id="localhost" title="127.0.0.1:7777">
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="3" y="4" width="18" height="12" rx="1.5" />
                <path d="M8 20h8M12 16v4" />
              </svg>
              CONNECT TO LOCALHOST
            </button>
          </div>
        </div>

        <div class="divider" aria-hidden="true"></div>

        <div class="realms">
          <div class="realms-head">
            <div class="eyebrow" id="count">REALMS · …</div>
            <label class="search" id="searchbox">
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#c9a45c"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-4-4" />
              </svg>
              <span class="sr-only">Search servers</span>
              <input
                id="search"
                type="text"
                placeholder="Search by name or host…"
                autocomplete="off"
                spellcheck="false"
              />
              <button type="button" class="clear" id="clear" hidden aria-label="Clear search">
                <svg
                  width="13"
                  height="13"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.4"
                  stroke-linecap="round"
                  aria-hidden="true"
                >
                  <path d="M6 6l12 12M18 6 6 18" />
                </svg>
              </button>
            </label>
            <button
              type="button"
              class="ico refresh"
              id="refresh"
              aria-label="Refresh servers"
              title="Refresh"
            >
              <span class="icon">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.9"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M20 11a8 8 0 1 0-2.3 5.7" />
                  <path d="M20 4v7h-7" />
                </svg>
              </span>
            </button>
            <div class="head-divider" aria-hidden="true"></div>
            <button type="button" class="tool" id="toolstudio" title="Animations and assets">
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m12 3 9 5-9 5-9-5z" />
                <path d="m3 12.5 9 5 9-5" />
                <path d="m3 17 9 5 9-5" />
              </svg>
              ANIM / ASSETS
            </button>
            <button type="button" class="tool" id="toolarchitect" title="World Architect">
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 21h18" />
                <path d="M5 21V10l2-1V5h2v2h2V5h2v2h2V5h2v4l2 1v11" />
                <path d="M10 21v-4a2 2 0 0 1 4 0v4" />
              </svg>
              WORLD ARCHITECT
            </button>
            <div class="head-divider" aria-hidden="true"></div>
            <button type="button" class="exit-game" id="exitgame" title="Exit game">
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10" />
              </svg>
              EXIT GAME
            </button>
          </div>
          <div class="fetching" id="fetching" hidden>
            <span class="ring spin"></span>Riders are fetching the master list…
          </div>
          <div class="strip" id="strip" role="listbox" aria-label="Available servers"></div>
        </div>
      </section>

      <div class="footer" id="footer">KCD2-Synced</div>

      <div class="scrim" id="scrim" hidden>
        <div class="dialog" id="dialog" role="dialog" aria-modal="true"></div>
      </div>
    </div>

    <script>
      (function () {
        'use strict';

        var REFERENCE_HEIGHT = 900;
        var AUTO_REFRESH_MS = 15000;
        var OFFLINE_RETRY_SECONDS = 15;
        var LOCALHOST = '127.0.0.1:7777';
        var STEPS = [
          'Reaching the server',
          'Checking game version',
          'Checking server requirements',
          'Syncing mods',
          'Entering the world',
        ];

        // ---- bridge -------------------------------------------------------------------------------
        // In game the page runs in the game client's CEF view: it sends with sendToGame and receives
        // CustomEvents on window (both present from the first line, so no sample data).
        var CHANNEL = 'kcds:menu';
        var HOST = null;
        if (typeof sendToGame === 'function') {
          HOST = {
            postMessage: function (message) {
              sendToGame(CHANNEL, JSON.stringify(message));
            },
            addEventListener: function (name, handler) {
              window.addEventListener(CHANNEL, function (event) {
                handler({ data: event.detail });
              });
            },
          };
        } else if (window.chrome && window.chrome.webview) {
          HOST = window.chrome.webview;
        }
        var BRIDGE = !!HOST;
        if (!HOST) document.documentElement.classList.add('preview');

        function send(type, data) {
          var message = Object.assign({ type: type }, data || {});
          if (HOST) {
            HOST.postMessage(message);
            return Promise.resolve({});
          }
          try {
            return fetch('https://kcd2s-menu/' + type, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json; charset=UTF-8' },
              body: JSON.stringify(data || {}),
            }).then(function (r) {
              return r.json().catch(function () {
                return {};
              });
            });
          } catch (e) {
            return Promise.reject(e);
          }
        }

        // ---- state --------------------------------------------------------------------------------
        // list: 'loading' (no answer yet), 'ready', 'empty' (loaded, no servers), 'offline'.
        var state = {
          list: 'loading',
          servers: [],
          q: '',
          selected: null,
          error: '',
          showDetails: false,
          retryAt: 0,
          protocol: 1,
          gameVersion: '',
          dialog: null, // the open popup: { kind, server, ... }
          download: null, // { at, bytes }: the first progress report of this join, for the ETA
          lastJoin: null, // { id } or { address } to try again
          // A lost connection's message, shown once the game is back in this menu.
          disconnectNotice: null,
          queueSound: true,
        };
        try {
          state.selected = window.localStorage.getItem('kcds.lastServer');
          state.queueSound = window.localStorage.getItem('kcds.queueSound') !== 'off';
        } catch (e) {
          /* no storage */
        }

        var $ = function (id) {
          return document.getElementById(id);
        };

        // ---- scale the 1600x900 reference to the window -------------------------------------------
        function layout() {
          var scale = window.innerHeight / REFERENCE_HEIGHT;
          var stage = $('stage');
          stage.style.width = window.innerWidth / scale + 'px';
          stage.style.transform = 'scale(' + scale + ')';
        }
        window.addEventListener('resize', layout);
        layout();

        // ---- small DOM helpers (text only, never markup) ------------------------------------------
        function el(tag, className, text) {
          var node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined && text !== null) node.textContent = String(text);
          return node;
        }
        var SVG = 'http://www.w3.org/2000/svg';
        // Icons are fixed paths from the design; never data from a server.
        function icon(paths, size, stroke) {
          var svg = document.createElementNS(SVG, 'svg');
          svg.setAttribute('width', size);
          svg.setAttribute('height', size);
          svg.setAttribute('viewBox', '0 0 24 24');
          svg.setAttribute('fill', 'none');
          svg.setAttribute('stroke', 'currentColor');
          svg.setAttribute('stroke-width', stroke);
          svg.setAttribute('stroke-linecap', 'round');
          svg.setAttribute('stroke-linejoin', 'round');
          svg.setAttribute('aria-hidden', 'true');
          paths.forEach(function (d) {
            var path = document.createElementNS(SVG, 'path');
            path.setAttribute('d', d);
            svg.appendChild(path);
          });
          return svg;
        }
        var ICONS = {
          arrow: ['M5 12h14M13 6l6 6-6 6'],
          retry: ['M20 11a8 8 0 1 0-2.3 5.7', 'M20 4v7h-7'],
          close: ['M6 6l12 12M18 6 6 18'],
          tick: ['M5 12.5 10 17 19 7'],
          mic: ['M9 6a3 3 0 0 1 6 0v6a3 3 0 0 1-6 0z', 'M5 11a7 7 0 0 0 14 0', 'M12 18v4M8 22h8'],
          shield: ['M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z'],
          warning: ['M12 3 2 20h20z', 'M12 10v4M12 17.5v.01'],
          hourglass: ['M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9'],
          download: ['M12 4v11M7 10l5 5 5-5M5 20h14'],
          leave: ['M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10'],
          offline: [
            'M3 3l18 18',
            'M8 8a5 5 0 0 0-1 9.9h10.5M19.5 15.5A4 4 0 0 0 17 8h-.5A6 6 0 0 0 11 4.6',
          ],
        };
        function button(kind, label, iconName, onClick) {
          var node = el('button', 'btn ' + kind);
          node.type = 'button';
          node.appendChild(document.createTextNode(label));
          if (iconName) node.appendChild(icon(ICONS[iconName], 15, 2.2));
          node.addEventListener('click', onClick);
          return node;
        }

        // ---- server helpers -----------------------------------------------------------------------
        function isFull(s) {
          return s.maxPlayers > 0 && s.players >= s.maxPlayers;
        }
        function fill(s) {
          return s.maxPlayers > 0 ? Math.min(1, s.players / s.maxPlayers) : 0;
        }
        // Status color: red when full, amber from 80 %, green otherwise.
        function tone(s) {
          if (isFull(s)) return '#d0705a';
          return fill(s) >= 0.8 ? '#e0ac55' : '#9cbc6c';
        }
        function compatible(s) {
          return !s.protocol || s.protocol === state.protocol;
        }
        function gradient(s) {
          var h = 0;
          var text = String(s.id || s.name || s.address || '');
          for (var i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) & 0xffffff;
          var a = h % 360;
          var b = (a + 38) % 360;
          return (
            'radial-gradient(120% 90% at 50% 18%, hsl(' + a + ',30%,30%), hsl(' + b + ',36%,11%))'
          );
        }
        // Card art: the https image of the list entry over the server's heraldic gradient, which
        // stays when the image is missing or fails to load.
        function art(s, className) {
          var node = el('div', className);
          node.style.background = gradient(s);
          var url = s.image || s.img;
          if (typeof url === 'string' && /^https:\/\/[^\s"'()<>\\`]+$/.test(url)) {
            var img = document.createElement('img');
            img.alt = '';
            img.decoding = 'async';
            img.referrerPolicy = 'no-referrer';
            img.addEventListener('error', function () {

            });
            img.src = url;
            node.appendChild(img);
          }
          return node;
        }
        function selectedServer() {
          for (var i = 0; i < state.servers.length; i++) {

        // ---- left column --------------------------------------------------------------------------
        function renderDetail() {
          var top = $('detail-top');

          var ride = $('connect');

        // ---- right column -------------------------------------------------------------------------
        function view() {
          var q = state.q.trim().toLowerCase();
          return state.servers.filter(function (s) {

        function card(s) {

          });

          else if (s.password) node.appendChild(el('span', 'full locked', 'PASSWORD'));
          var meta = el('div', 'meta');
          var name = el('div', 'cname', s.name);
          name.title = s.name;
          meta.appendChild(name);
          var pop = el('div', 'cpop');
          pop.appendChild(el('span', 'num', s.players));

            select(s.id);

        function offlineBlock() {
          var block = el('div', 'block offline');
          var inner = el('div', 'block-inner');
          var mark = el('div', 'block-icon');
          mark.appendChild(icon(ICONS.offline, 30, 1.7));
          inner.appendChild(mark);
          var text = el('div', 'block-text');
          text.appendChild(el('div', 'block-eyebrow', 'SERVER LIST UNAVAILABLE'));
          text.appendChild(el('div', 'block-title', 'The herald cannot reach the master list'));
          var body = el('div', 'block-body');
          body.appendChild(
            document.createTextNode(
              'Check your internet connection. We will try again on our own in ',
            ),
          );
          var count = el('span', 'em', secondsLeft() + ' s');
          count.id = 'retry-count';
          body.appendChild(count);
          body.appendChild(document.createTextNode('.'));
          text.appendChild(body);
          var actions = el('div', 'block-actions');
          actions.appendChild(button('secondary', 'TRY AGAIN', 'retry', refresh));
          var details = el(
            'button',
            'linkish',
            state.showDetails ? 'Hide details' : 'Show details',
          );
          details.type = 'button';
          details.addEventListener('click', function () {
            state.showDetails = !state.showDetails;
            render();
          });
          actions.appendChild(details);
          text.appendChild(actions);
          if (state.showDetails) {
            text.appendChild(el('div', 'code', state.error || 'no details'));
          }
