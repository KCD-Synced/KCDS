<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KCD2-Synced</title>
    <!--
  KCDS in-game server browser: the user's "redesigned server panel" design with all of
  its frames (Launcher, State-Loading, State-ListOffline, State-Empty and the popups Connecting,
  ConnectFailed, ConfirmQueue, InQueue, UpdateRequired, Disconnected) and its design manual. The
  1600x900 reference layout is scaled to the game window; the top stays transparent so the game's
  main-menu scene and our logo show through.

  In game the page runs in the client's CEF view (Client/ui/compositor, Client/ui/web) and talks
  to kcd2s::platform::MenuSession over the "kcds:menu" channel (see menu_session.hpp for every
  message):
    game -> page : CustomEvent "kcds:menu", detail {type, ...}   "self", "servers", "state"
    page -> game : sendToGame("kcds:menu", JSON {type, ...})     ready, refresh, connect, direct,
                                                                cancel, update, quit, dismiss, tool
  Outside the game the same messages use the NUI bridge (window "message" events in,
  fetch("https://kcd2s-menu/<cb>") out); without any bridge, sample data is shown for design
  preview. Sample data never appears in game.

  Everything that comes from a server or the master (names, reasons, queue fields) is rendered as
  text, never as markup. Fonts: Cinzel and EB Garamond ship in fonts/ (SIL OFL).
-->
    <link rel="stylesheet" href="fonts/fonts.css" />
    <style>
      :root {
        --night: #0d0b08;
        --gold: #d9b56c;
        --gold-hover: #ecca82;
        --gold-light: #e4c27a;
        --gold-muted: #c9a45c;
        --gold-pale: #f3dba3;
        --parchment: #f6edd8;
        --body: #ece3cf;
        --muted: #a99c82;
        --soft: #c2b597;
        --text: #d9cfb8;
        --healthy: #9cbc6c;
        --busy: #e0ac55;
        --amber: #e9b968;
        --danger: #d0705a;
        --danger-light: #e8907a;
        --serif-display: Cinzel, Georgia, serif;
        --serif-text: 'EB Garamond', Georgia, 'Times New Roman', serif;
        --mono: ui-monospace, Consolas, monospace;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      html.preview body {
        background: var(--night);
      }
      button {
        font: inherit;
      }
      input::placeholder {
        color: #9a8e77;
      }
      :focus {
        outline: none;
      }
      :focus-visible {
        outline: 2px solid var(--parchment);
        outline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
      @keyframes klshimmer {
        0% {
          background-position: -300px 0;
        }
        100% {
          background-position: 300px 0;
        }
      }
      @keyframes klspin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes klbar {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      .skel {
        background: linear-gradient(
          90deg,
          rgba(255, 240, 210, 0.05) 0%,
          rgba(255, 240, 210, 0.13) 50%,
          rgba(255, 240, 210, 0.05) 100%
        );
        background-size: 600px 100%;
        animation: klshimmer 1.6s linear infinite;
      }
      .spin {
        animation: klspin 1.1s linear infinite;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }

      /* ---- stage: the 1600x900 reference, scaled to the window height ---------------------------- */
      .stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1600px;
        height: 900px;
        transform-origin: 0 0;
        overflow: hidden;
        font-family: var(--serif-text);
        color: var(--body);
      }
      /* ---- the server browser (design SB-16): a side panel of lists, filters and tags, and the
         list of servers whose rows open for more ------------------------------------------------ */
      .scene-dim {
        position: absolute;
        inset: 0;
        background: rgba(8, 6, 4, 0.62);
      }
      .glass {
        position: absolute;
        top: 40px;
        bottom: 40px;
        box-sizing: border-box;
        padding: 20px;
        display: flex;
        flex-direction: column;
        background: rgba(12, 10, 7, 0.55);
        backdrop-filter: blur(18px) saturate(1.1);
        -webkit-backdrop-filter: blur(18px) saturate(1.1);
        border: 1px solid rgba(201, 164, 92, 0.3);
        border-radius: 8px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
      }
      .side {
        left: 40px;
        width: 280px;
        gap: 12px;
      }
      .main {
        left: 340px;
        right: 40px;
        gap: 10px;
        container-type: inline-size;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 4px 2px 8px;
      }
      .brand-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      }
      .brand-name {
        font-family: var(--serif-display);
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 3.5px;
        color: #e9dcbc;
      }
      .brand-sub {
        font-size: 14px;
        color: var(--muted);
      }
      .tabs {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .tab {
        width: 100%;
        height: 42px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        background: transparent;
        border: 0;
        border-radius: 5px;
        color: #b9ad92;
        font-family: var(--serif-display);
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        cursor: pointer;
        white-space: nowrap;
      }
      .tab:hover {
        color: var(--gold-pale);
      }
      .tab[aria-selected='true'] {
        background: rgba(217, 181, 108, 0.16);
        color: #f6e3b4;
        box-shadow: inset 3px 0 0 var(--gold-light);
      }
      .tab[aria-selected='true'] svg {
        color: var(--gold-light);
      }
      .tab .c {
        margin-left: auto;
        font-family: var(--serif-text);
        font-size: 13px;
        letter-spacing: 0;
        color: #8f836c;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 9px;
        padding: 0 7px;
        line-height: 18px;
      }
      .tab .c.go {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 20px;
        height: 18px;
        padding: 0 4px;
        box-sizing: border-box;
        color: var(--gold-light);
      }
      .side-rule {
        height: 1px;
        background: rgba(201, 164, 92, 0.18);
        margin: 2px 0;
      }
      .grp {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 0 4px;
        font-family: var(--serif-display);
        font-size: 11px;
        letter-spacing: 3px;
        color: var(--gold-muted);
      }
      .grp::after {
        content: '';
        flex: 1;
        height: 1px;
        background: rgba(201, 164, 92, 0.22);
      }
      .checks {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .check-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        color: #cdbf9f;
        cursor: pointer;
      }
      .check-row input {
        appearance: none;
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        margin: 0;
        border: 1px solid rgba(201, 164, 92, 0.6);
        border-radius: 3px;
        background: transparent;
        flex-shrink: 0;
        cursor: pointer;
      }
      .check-row input:checked {
        background: var(--gold);
      }
      .check-row:has(input:checked) {
        color: #f6e3b4;
      }
      .tagf {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .tg {
        display: inline-flex;
        align-items: center;
        height: 26px;
        padding: 0 10px;
        border: 1px solid rgba(201, 164, 92, 0.3);
        border-radius: 13px;
        background: rgba(0, 0, 0, 0.25);
        color: #cdbf9f;
        font-family: var(--serif-text);
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
      }
      .tg[aria-pressed='true'] {
        background: rgba(217, 181, 108, 0.22);
        border-color: var(--gold-light);
        color: #f6e3b4;
      }
      .side-foot {
        margin-top: auto;
        display: flex;
        gap: 8px;
      }
      .ibtn {
        width: 38px;
        height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(201, 164, 92, 0.35);
        border-radius: 50%;
        color: var(--gold-light);
        cursor: pointer;
        padding: 0;
        flex-shrink: 0;
      }
      .ibtn:hover {
        border-color: var(--gold-light);
        color: var(--gold-pale);
      }
      .ibtn.ex:hover {
        border-color: var(--danger);
        color: #f0a08c;
        background: rgba(120, 30, 20, 0.3);
      }
      .refresh.spinning svg {
        animation: klspin 1.1s linear infinite;
      }
      .main-head {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .showing {
        font-size: 14px;
        color: #8f836c;
      }
      .grow {
        flex: 1;
      }
      .head-row,
      .row {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr) 300px 160px 100px 20px;
        gap: 14px;
        align-items: center;
        padding: 0 14px;
      }
      .no-ping .head-row,
      .no-ping .row {
        grid-template-columns: 28px minmax(0, 1fr) 300px 160px 20px;
      }
      .no-ping .ping-col {
        display: none;
      }
      .head-row {
        height: 32px;
        font-family: var(--serif-display);
        font-size: 10.5px;
        letter-spacing: 2px;
        color: #8f836c;
        border-bottom: 1px solid rgba(201, 164, 92, 0.2);
      }
      .head-row .s {
        color: var(--gold-light);
      }
      .list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding-right: 6px;
        margin-right: -6px;
      }
      .list::-webkit-scrollbar {
        width: 6px;
      }
      .list::-webkit-scrollbar-thumb {
        background: rgba(201, 164, 92, 0.45);
        border-radius: 3px;
      }
      .list::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.04);
        border-radius: 3px;
      }
      .it {
        flex-shrink: 0;
        border-radius: 6px;
        border: 1px solid transparent;
      }
      .it.open {
        background: rgba(217, 181, 108, 0.1);
        border-color: rgba(228, 194, 122, 0.55);
      }
      .row {
        height: 58px;
        border-radius: 5px;
        cursor: pointer;
      }
      .it:not(.open) .row:hover {
        background: rgba(255, 240, 210, 0.05);
      }
      .row .nm {
        font-family: var(--serif-display);
        font-weight: 600;
        font-size: 15px;
        color: #e6dcc4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .it.open .row .nm {
        color: #f6e3b4;
      }
      .row .ds {
        font-size: 14px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .star {
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        border: 0;
        background: rgba(0, 0, 0, 0.35);
        color: #b9ad92;
        cursor: pointer;
        padding: 0;
        flex-shrink: 0;
      }
      .star:hover {
        color: var(--gold-pale);
        background: rgba(0, 0, 0, 0.55);
      }
      .star[aria-pressed='true'] {
        color: #f0c35a;
      }
      .tgs {
        display: flex;
        gap: 4px;
        overflow: hidden;
      }
      .tgs.wrap {
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .tag {
        display: inline-block;
        padding: 1px 8px;
        border: 1px solid rgba(201, 164, 92, 0.35);
        border-radius: 10px;
        font-size: 13px;
        color: #cdbf9f;
        white-space: nowrap;
      }
      .pl {
        font-size: 15px;
        color: #cfc3a8;
        white-space: nowrap;
      }
      .pl b {
        font-family: var(--serif-display);
        font-weight: 600;
        color: var(--parchment);
      }
      .full-badge {
        display: inline-block;
        margin-left: 6px;
        padding: 2px 7px;
        border-radius: 2px;
        background: rgba(140, 36, 24, 0.92);
        color: #fbe6dc;
        font-family: var(--serif-display);
        font-size: 10px;
        letter-spacing: 1.5px;
        white-space: nowrap;
      }
      .full-badge.locked {
        background: rgba(90, 70, 30, 0.92);
      }
      .pbar {
        display: block;
        width: 130px;
        height: 3px;
        margin-top: 4px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 2px;
        overflow: hidden;
      }
      .pbar i {
        display: block;
        height: 100%;
      }
      .ping {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        color: var(--soft);
        white-space: nowrap;
      }
      .ping .b {
        display: inline-flex;
        gap: 2px;
        align-items: flex-end;
        height: 13px;
      }
      .ping i {
        width: 3px;
        border-radius: 1px;
      }
      .chev {
        display: inline-flex;
        color: var(--muted);
        transition: transform 0.2s;
      }
      .it.open .chev {
        transform: rotate(90deg);
        color: var(--gold-light);
      }
      .xp {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr) 230px;
        gap: 22px;
        padding: 4px 16px 18px 56px;
      }
      .xp-art {
        position: relative;
        width: 240px;
        height: 135px;
        overflow: hidden;
        border-radius: 5px;
        border: 1px solid rgba(201, 164, 92, 0.35);
      }
      .xp-art img,
      .thumb img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .xp p {
        margin: 0 0 10px;
        font-size: 16px;
        line-height: 1.5;
        color: var(--text);
        overflow-wrap: anywhere;
      }
      .kv {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 14px;
        font-size: 14px;
        color: var(--muted);
      }
      .kv b {
        font-weight: 500;
        color: #e6dcc4;
        overflow-wrap: anywhere;
      }
      .xp-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        justify-content: flex-end;
      }
      .ghost {
        height: 36px;
        padding: 0 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: transparent;
        border: 1px solid rgba(201, 164, 92, 0.4);
        border-radius: 4px;
        color: var(--gold-light);
        font-family: var(--serif-display);
        font-size: 11px;
        letter-spacing: 2px;
        cursor: pointer;
      }
      .ghost:hover {
        border-color: var(--gold-light);
        color: var(--gold-pale);
      }
      .go {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: var(--gold);
        color: #1a140b;
        border: 1px solid var(--gold-pale);
        border-radius: 5px;
        box-shadow: 0 0 0 4px rgba(217, 181, 108, 0.16), 0 8px 24px rgba(0, 0, 0, 0.45);
        font-family: var(--serif-display);
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 4px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .go:hover {
        background: var(--gold-hover);
      }
      .go:disabled {
        background: rgba(217, 181, 108, 0.18);
        color: rgba(246, 237, 216, 0.55);
        border-color: rgba(217, 181, 108, 0.3);
        box-shadow: none;
        cursor: not-allowed;
      }
      .go.busy,
      .go.busy:disabled {
        background: var(--gold);
        color: #1a140b;
        border-color: var(--gold-pale);
        cursor: progress;
      }
      .xp-actions .go {
        height: 50px;
      }
      .main-foot {
        display: flex;
        align-items: center;
        gap: 12px;
        border-top: 1px solid rgba(201, 164, 92, 0.22);
        padding-top: 12px;
      }
      .main-foot > .go {
        width: 260px;
        height: 46px;
      }
      .direct-wrap {
        width: 460px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .direct {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .direct input {
        flex: 1;
        min-width: 0;
        height: 36px;
        box-sizing: border-box;
        padding: 0 12px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(201, 164, 92, 0.22);
        border-radius: 4px;
        color: var(--body);
        font-family: var(--serif-text);
        font-size: 15px;
        outline: none;
      }
      .direct input:focus {
        border-color: rgba(228, 194, 122, 0.8);
      }
      .direct input.error {
        border-color: var(--danger);
      }
      .direct input.port {
        width: 72px;
        flex: none;
        text-align: center;
      }
      .direct > span {
        font-family: var(--serif-display);
        color: #8a7f6b;
      }
      .skel-row {
        height: 58px;
        flex-shrink: 0;
        border-radius: 5px;
      }
      /* A narrower window (4:3, 5:4): the columns and an opened row's parts give way to the name.
         After the rules above, so it wins over them. */
      @container (max-width: 1060px) {
        .head-row,
        .row {
          grid-template-columns: 28px minmax(0, 1fr) 170px 120px 88px 20px;
        }
        .no-ping .head-row,
        .no-ping .row {
          grid-template-columns: 28px minmax(0, 1fr) 170px 120px 20px;
        }
        .pbar {
          width: 100px;
        }
        .xp {
          grid-template-columns: 170px minmax(0, 1fr) 200px;
          padding-left: 16px;
        }
        .xp-art {
          width: 170px;
          height: 96px;
        }
        .search {
          width: 300px;
        }
        .direct-wrap {
          width: 380px;
        }
        .main-foot > .go {
          width: 220px;
        }
      }
      .num {
        font-family: var(--serif-display);
        font-weight: 600;
        color: var(--parchment);
      }
      .busy-ring {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid rgba(26, 20, 11, 0.25);
        border-top-color: #1a140b;
        box-sizing: border-box;
      }
      .field {
        flex-grow: 1;
        min-width: 0;
        height: 36px;
        box-sizing: border-box;
        padding: 0 12px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(201, 164, 92, 0.22);
        border-radius: 4px;
        color: var(--body);
        font-family: var(--serif-text);
        font-size: 15px;
        outline: none;
      }
      .field:focus {
        border-color: rgba(228, 194, 122, 0.8);
      }
      /* The bug report dialog over the game world (the ESC menu's Report a bug): only the dialog. */
      .stage.over-world > :not(.scrim) {
        visibility: hidden;
      }
      .bugtext {
        display: block;
        width: 100%;
        height: auto;
        min-height: 120px;
        padding: 10px 12px;
        resize: vertical;
        line-height: 1.4;
      }
      .bugagree {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin-top: 12px;
        color: var(--body);
        font-family: var(--serif-text);
        font-size: 15px;
        cursor: pointer;
      }
      .bugagree input {
        margin-top: 3px;
        accent-color: var(--gold);
      }
      .bugnote {
        margin-top: 12px;
        font-size: 13px;
        opacity: 0.8;
      }
      .field.error {
        border-color: var(--danger);
      }
      .field-error {
        font-size: 14px;
        color: var(--danger-light);
        margin-top: -4px;
      }
      .ico {
        height: 36px;
        background: transparent;
        border: 1px solid rgba(201, 164, 92, 0.4);
        border-radius: 4px;
        color: var(--gold-light);
        font-family: var(--serif-display);
        font-size: 11px;
        letter-spacing: 2px;
        cursor: pointer;
      }
      .ico:hover {
        border-color: var(--gold-light);
        color: var(--gold-pale);
      }
      .join {
        padding: 0 14px;
      }
      .refresh .icon {
        display: flex;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 0 1 380px;
        min-width: 140px;
        width: 380px;
        height: 38px;
        padding: 0 12px;
        box-sizing: border-box;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(201, 164, 92, 0.28);
        border-radius: 19px;
        color: var(--gold-muted);
        flex-shrink: 0;
      }
      .search.dim {
        opacity: 0.5;
      }
      .search:focus-within {
        border-color: rgba(228, 194, 122, 0.8);
      }
      .search input {
        flex-grow: 1;
        min-width: 0;
        background: transparent;
        border: 0;
        outline: none;
        color: var(--body);
        font-family: var(--serif-text);
        font-size: 16px;
      }
      .clear {
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: 0;
        color: var(--gold-muted);
        cursor: pointer;
        padding: 0;
      }
      .fetching {
        display: flex;
        align-items: center;
        gap: 10px;
        font-style: italic;
        font-size: 16px;
        color: var(--soft);
      }
      .ring {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid rgba(228, 194, 122, 0.25);
        border-top-color: var(--gold-light);
        box-sizing: border-box;
      }
      .list.blocked {
        overflow: hidden;
      }
      .no-match {
        height: 120px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px dashed rgba(201, 164, 92, 0.35);
        border-radius: 6px;
        font-style: italic;
        font-size: 15px;
        color: var(--muted);
      }

      /* ---- list blocks: unavailable and empty ------------------------------------------------------- */
      .block {
        flex-grow: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px dashed rgba(201, 164, 92, 0.3);
        border-radius: 6px;
      }
      .block.offline {
        border-color: rgba(208, 112, 90, 0.4);
        background: rgba(60, 20, 12, 0.18);
      }
      .block-inner {
        display: flex;
        align-items: center;
        gap: 24px;
        max-width: 640px;
      }
      .block-icon {
        width: 72px;
        height: 72px;
        flex-shrink: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(217, 181, 108, 0.1);
        border: 1px solid rgba(217, 181, 108, 0.45);
        color: var(--gold-light);
      }
      .block.offline .block-icon {
        background: rgba(208, 112, 90, 0.14);
        border-color: rgba(208, 112, 90, 0.6);
        color: var(--danger-light);
      }
      .block-text {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .block-eyebrow {
        font-family: var(--serif-display);
        font-size: 11px;
        letter-spacing: 4px;
        color: var(--danger-light);
      }
      .block-title {
        font-family: var(--serif-display);
        font-weight: 700;
        font-size: 24px;
        color: var(--parchment);
      }
      .block-body {
        font-size: 17px;
        line-height: 1.45;
        color: var(--soft);
      }
      .block-body .em {
        color: var(--parchment);
      }
      .block-actions {
        display: flex;
        gap: 10px;
        margin-top: 6px;
        align-items: center;
      }
      .linkish {
        height: 48px;
        padding: 0 12px;
        background: transparent;
        border: 0;
        color: var(--muted);
        font-family: var(--serif-text);
        font-size: 16px;
        text-decoration: underline;
        cursor: pointer;
      }
      .code {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--muted);
        padding: 10px 12px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(208, 112, 90, 0.25);
        border-radius: 4px;
        overflow-wrap: anywhere;
      }

      .footer {
        position: absolute;
        right: 44px;
        bottom: 14px;
        font-size: 12px;
        color: rgba(236, 227, 207, 0.5);
      }

      /* ---- buttons (design manual 03) ------------------------------------------------------------- */
      .btn {
        height: 48px;
        padding: 0 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border-radius: 5px;
        font-family: var(--serif-display);
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 2.5px;
        cursor: pointer;
      }
      .btn.primary {
        background: var(--gold);
        color: #1a140b;
        border: 1px solid var(--gold-pale);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      }
      .btn.primary:hover {
        background: var(--gold-hover);
      }
      .btn.secondary {
        background: rgba(0, 0, 0, 0.25);
        color: var(--gold-light);
        border: 1px solid rgba(201, 164, 92, 0.5);
      }
      .btn.secondary:hover {
        border-color: var(--gold-light);
      }
      .btn.danger {
        background: #b04a36;
        color: #fff3ee;
        border: 1px solid #e8907a;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      }
      .btn.danger:hover {
        background: #c2563f;
      }
      .exit-warn {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 12px 14px;
        background: rgba(224, 172, 85, 0.08);
        border: 1px solid rgba(224, 172, 85, 0.35);
        border-radius: 6px;
      }
      .exit-warn-icon {
        display: flex;
        margin-top: 2px;
        color: #e9b968;
      }
      .exit-warn-lines {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .exit-warn-title {
        font-size: 17px;
        color: #f6edd8;
      }
      .exit-warn-note {
        font-size: 15px;
        color: #a99c82;
      }
      .btn.ghost {
        background: transparent;
        color: #cfc3a8;
        border: 1px solid transparent;
      }
      .btn.ghost:hover {
        border-color: rgba(201, 164, 92, 0.4);
      }
      .btn:disabled {
        background: rgba(217, 181, 108, 0.18);
        color: rgba(246, 237, 216, 0.5);
        border: 1px solid rgba(217, 181, 108, 0.3);
        box-shadow: none;
        cursor: not-allowed;
      }

      /* ---- popups (design manual 06, 07) ---------------------------------------------------------- */
      .scrim {
        position: absolute;
        inset: 0;
        background: rgba(6, 5, 3, 0.62);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dialog {
        position: relative;
        width: 540px;
        box-sizing: border-box;
        padding: 32px 32px 26px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        background: rgba(18, 15, 11, 0.94);
        border: 1px solid rgba(201, 164, 92, 0.45);
        border-radius: 8px;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 240, 210, 0.06);
      }
      .close {
        position: absolute;
        right: 14px;
        top: 14px;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: 0;
        color: var(--muted);
        cursor: pointer;
        padding: 0;
      }
      .dhead {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .medallion {
        width: 56px;
        height: 56px;
        flex-shrink: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(217, 181, 108, 0.14);
        border: 1px solid rgba(217, 181, 108, 0.55);
        color: var(--gold-light);
      }
      .medallion.amber {
        background: rgba(224, 172, 85, 0.14);
        border-color: rgba(224, 172, 85, 0.6);
        color: var(--amber);
      }
      .medallion.red {
        background: rgba(208, 112, 90, 0.14);
        border-color: rgba(208, 112, 90, 0.6);
        color: var(--danger-light);
      }
      .dtitles {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .deyebrow {
        font-family: var(--serif-display);
        font-size: 11px;
        letter-spacing: 4px;
        color: var(--gold-light);
      }
      .deyebrow.amber {
        color: var(--amber);
      }
      .deyebrow.red {
        color: var(--danger-light);
      }
      .dtitle {
        margin: 0;
        font-family: var(--serif-display);
        font-weight: 700;
        font-size: 24px;
        line-height: 1.2;
        color: var(--parchment);
      }
      .dbody {
        margin: 0;
        font-size: 18px;
        line-height: 1.5;
        color: var(--text);
      }
      .dbody .em {
        color: var(--parchment);
      }
      .dnote {
        font-size: 16px;
        color: var(--muted);
      }
      .dfoot {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 10px;
        border-top: 1px solid rgba(201, 164, 92, 0.18);
        padding-top: 18px;
      }
      .dfoot .linkish {
        margin-right: auto;
        padding: 0;
      }
      .server-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px;
        background: rgba(0, 0, 0, 0.28);
        border: 1px solid rgba(201, 164, 92, 0.2);
        border-radius: 6px;
      }
      .thumb {
        position: relative;
        overflow: hidden;
        width: 64px;
        height: 44px;
        flex-shrink: 0;
        border-radius: 3px;
        border: 1px solid rgba(201, 164, 92, 0.35);
      }
      .row-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex-grow: 1;
        min-width: 0;
      }
      .row-name {
        font-family: var(--serif-display);
        font-weight: 600;
        font-size: 15px;
        color: var(--parchment);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row-host {
        font-size: 14px;
        color: var(--muted);
      }
      .row-pop {
        font-size: 15px;
        color: #cfc3a8;
        white-space: nowrap;
      }
      .steps {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .step {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 17px;
        color: #cfc3a8;
      }
      .step.active {
        color: var(--parchment);
      }
      .step.waiting {
        color: #8a7f6b;
      }
      .step.failed {
        color: var(--danger-light);
      }
      .tick,
      .cross {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(156, 188, 108, 0.18);
        color: var(--healthy);
      }
      .cross {
        background: rgba(208, 112, 90, 0.18);
        color: var(--danger-light);
      }
      .step-ring {
        width: 18px;
        height: 18px;
        margin: 2px;
        border-radius: 50%;
        border: 2px solid rgba(228, 194, 122, 0.25);
        border-top-color: var(--gold-light);
        box-sizing: border-box;
      }
      .step-dot {
        width: 8px;
        height: 8px;
        margin: 7px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
      }
      .progress {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .track {
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .slide {
        height: 6px;
        width: 40%;
        background: var(--gold);
        border-radius: 3px;
        animation: klbar 1.4s ease-in-out infinite;
      }
      .fill {
        height: 6px;
        background: var(--gold);
        border-radius: 3px;
        box-shadow: 0 0 12px rgba(217, 181, 108, 0.5);
        transition: width 0.2s linear;
      }
      .progress-text {
        display: flex;
        justify-content: space-between;
        font-size: 15px;
        color: var(--muted);
      }
      .check {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 17px;
        color: var(--text);
        cursor: pointer;
      }
      .check input {
        width: 20px;
        height: 20px;
        accent-color: var(--gold);
      }
      .queue-figures {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
        padding: 18px 0;
        border-top: 1px solid rgba(201, 164, 92, 0.15);
        border-bottom: 1px solid rgba(201, 164, 92, 0.15);
      }
      .figure {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }
      .figure .value {
        font-family: var(--serif-display);
        font-weight: 700;
        font-size: 44px;
        color: var(--parchment);
        line-height: 1;
      }
      .figure .label {
        font-size: 15px;
        color: var(--muted);
      }
      .figure-sep {
        width: 1px;
        height: 56px;
        background: rgba(201, 164, 92, 0.25);
      }
      .fields {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 16px;
      }
      .fields .field-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      .fields .field-label {
        color: var(--muted);
      }
      .fields .field-value {
        color: var(--body);
        text-align: right;
        overflow-wrap: anywhere;
      }
      .versions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .version-card {
        padding: 12px;
        background: rgba(0, 0, 0, 0.28);
        border: 1px solid rgba(201, 164, 92, 0.2);
        border-radius: 6px;
      }
      .version-card.required {
        background: rgba(217, 181, 108, 0.08);
        border-color: rgba(217, 181, 108, 0.4);
      }
      .version-card .label {
        font-size: 14px;
        color: var(--muted);
      }
      .version-card .value {
        font-family: var(--serif-display);
        font-weight: 600;
        font-size: 18px;
        color: var(--parchment);
      }
      .version-card.required .value {
        color: var(--gold-light);
      }
      .reason-box {
        padding: 12px 14px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(208, 112, 90, 0.3);
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .reason-box .label {
        font-family: var(--serif-display);
        font-size: 11px;
        letter-spacing: 3px;
        color: var(--danger-light);
      }
      .reason-box .value {
        font-size: 17px;
        color: var(--body);
      }
      @media (prefers-reduced-motion: reduce) {
        .skel,
        .spin,
        .slide,
        .refresh.spinning svg {
          animation: none;
        }
        .chev {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="scene-dim" aria-hidden="true"></div>

      <section class="glass side" aria-label="Server browser">
        <div class="brand">
          <svg width="44" height="44" viewBox="0 0 256 256" aria-hidden="true">
            <defs>
              <linearGradient id="brandfill" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#2a2118" />
                <stop offset="1" stop-color="#0f0c08" />
              </linearGradient>
            </defs>
            <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#brandfill)" />
            <rect
              x="14"
              y="14"
              width="228"
              height="228"
              rx="47"
              fill="none"
              stroke="#c9a45c"
              stroke-opacity="0.5"
              stroke-width="4"
            />
            <g fill="none" stroke="#e2bd72" stroke-width="12" stroke-linecap="square">
              <path d="M52 92V52h40" />
              <path d="M204 92V52h-40" />
              <path d="M52 164v40h40" />
              <path d="M204 164v40h-40" />
            </g>
            <text
              x="128"
              y="174"
              text-anchor="middle"
              font-family="Cinzel, serif"
              font-weight="700"
              font-size="124"
              fill="#f6edd8"
            >
              S
            </text>
          </svg>
          <div class="brand-text">
            <div class="brand-name">KCD2 SYNCED</div>
            <div class="brand-sub">Server browser</div>
          </div>
        </div>
        <div class="tabs" role="tablist" aria-label="Lists">
          <button type="button" class="tab" role="tab" data-tab="all" aria-selected="true">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" />
            </svg>
            All<span class="c" id="count-all">0</span>
          </button>
          <button type="button" class="tab" role="tab" data-tab="favourites" aria-selected="false">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1L3.2 9.6l6.1-.8z"
              />
            </svg>
            Favourites<span class="c" id="count-favourites">0</span>
          </button>
          <button type="button" class="tab" role="tab" data-tab="recent" aria-selected="false">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3 2" />
            </svg>
            Recent<span class="c" id="count-recent">0</span>
          </button>
        </div>
        <div class="side-rule" aria-hidden="true"></div>
        <button type="button" class="tab" id="localhost" title="Connect to 127.0.0.1:7777">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="4" width="18" height="12" rx="1.5" />
            <path d="M8 20h8M12 16v4" />
          </svg>
          Localhost<span class="c go"
            ><svg
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14M13 6l6 6-6 6" /></svg
          ></span>
        </button>
        <div class="grp">FILTERS</div>
        <div class="checks" id="checks">
          <label class="check-row"
            ><input type="checkbox" data-filter="players" />Has players</label
          >
          <label class="check-row"><input type="checkbox" data-filter="notfull" />Not full</label>
          <label class="check-row" id="ping-filter" hidden
            ><input type="checkbox" data-filter="ping" />Ping under 60 ms</label
          >
        </div>
        <div class="grp">TAGS</div>
        <div class="tagf" id="tagf"></div>
        <div class="side-foot">
          <button
            type="button"
            class="ibtn"
            id="toolstudio"
            aria-label="Animations and assets"
            title="Animations and assets"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m12 3 9 5-9 5-9-5z" />
              <path d="m3 12.5 9 5 9-5" />
              <path d="m3 17 9 5 9-5" />
            </svg>
          </button>
          <button
            type="button"
            class="ibtn"
            id="toolarchitect"
            aria-label="World Architect"
            title="World Architect"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 21h18" />
              <path d="M5 21V10l2-1V5h2v2h2V5h2v2h2V5h2v4l2 1v11" />
              <path d="M10 21v-4a2 2 0 0 1 4 0v4" />
            </svg>
          </button>
          <button
            type="button"
            class="ibtn ex"
            id="exitgame"
            aria-label="Exit game"
            title="Exit game"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10" />
            </svg>
          </button>
        </div>
      </section>

      <section class="glass main" aria-label="Servers">
        <div class="main-head">
          <label class="search" id="searchbox">
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#c9a45c"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-4-4" />
            </svg>
            <span class="sr-only">Search servers</span>
            <input
              id="search"
              type="text"
              placeholder="Search name, host, description…"
              autocomplete="off"
              spellcheck="false"
            />
            <button type="button" class="clear" id="clear" hidden aria-label="Clear search">
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <path d="M6 6l12 12M18 6 6 18" />
              </svg>
            </button>
          </label>
          <span class="showing" id="count"></span>
          <span class="grow"></span>
          <button
            type="button"
            class="ibtn refresh"
            id="refresh"
            aria-label="Refresh servers"
            title="Refresh"
          >
            <span class="icon">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.9"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M20 11a8 8 0 1 0-2.3 5.7" />
                <path d="M20 4v7h-7" />
              </svg>
            </span>
          </button>
          <button
            type="button"
            class="ibtn"
            id="settings"
            aria-label="Game settings"
            title="Settings"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
              />
            </svg>
          </button>
          <button
            type="button"
            class="ibtn"
            id="logs"
            aria-label="Open the logs folder"
            title="Open the logs folder (send these with a bug report)"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <path d="M8 12h8" />
              <path d="M8 15.5h5" />
            </svg>
          </button>
        </div>
        <div class="head-row" id="head-row" aria-hidden="true">
          <span>★</span><span>SERVER</span><span>TAGS</span><span class="s">PLAYERS ▾</span
          ><span class="ping-col">PING</span><span></span>
        </div>
        <div class="fetching" id="fetching" hidden>
          <span class="ring spin"></span>Riders are fetching the master list…
        </div>
        <div class="list" id="strip" role="list" aria-label="Servers"></div>
        <div class="main-foot">
          <div class="direct-wrap">
            <div class="direct">
              <label for="direct" class="sr-only">Server IP or host</label>
              <input
                id="direct"
                type="text"
                placeholder="IP or host"
                autocomplete="off"
                spellcheck="false"
              />
              <span>:</span>
              <label for="direct-port" class="sr-only">Port</label>
              <input
                id="direct-port"
                class="port"
                type="text"
                placeholder="7777"
                inputmode="numeric"
                autocomplete="off"
              />
              <button type="button" class="ghost" id="directbtn">JOIN</button>
            </div>
            <div class="field-error" id="direct-error" hidden></div>
          </div>
          <span class="grow"></span>
          <button type="button" class="go" id="connect" disabled>
            <span class="busy-ring spin" id="ride-busy" hidden></span>
            <span id="ridelabel">CONNECT</span>
            <svg
              id="ride-arrow"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </button>
        </div>
      </section>

      <div class="footer" id="footer">KCD2-Synced</div>

      <div class="scrim" id="scrim" hidden>
        <div class="dialog" id="dialog" role="dialog" aria-modal="true"></div>
      </div>
    </div>

    <script>
      (function () {
        'use strict';

        var REFERENCE_HEIGHT = 900;
        var AUTO_REFRESH_MS = 15000;
        var OFFLINE_RETRY_SECONDS = 15;
        // The port a game server listens on unless its owner chose another.
        var DEFAULT_PORT = 7777;
        var LOCALHOST = '127.0.0.1:' + DEFAULT_PORT;
        var STEPS = [
          'Reaching the server',
          'Checking game version',
          'Checking server requirements',
          'Syncing mods',
          'Entering the world',
        ];

        // ---- bridge -------------------------------------------------------------------------------
        // In game the page runs in the game client's CEF view: it sends with sendToGame and receives
        // CustomEvents on window (both present from the first line, so no sample data).
        var CHANNEL = 'kcds:menu';
        var HOST = null;
        if (typeof sendToGame === 'function') {
          HOST = {
            postMessage: function (message) {
              sendToGame(CHANNEL, JSON.stringify(message));
            },
            addEventListener: function (name, handler) {
              window.addEventListener(CHANNEL, function (event) {
                handler({ data: event.detail });
              });
            },
          };
        } else if (window.chrome && window.chrome.webview) {
          HOST = window.chrome.webview;
        }
        var BRIDGE = !!HOST;
        if (!HOST) document.documentElement.classList.add('preview');

        function send(type, data) {
          var message = Object.assign({ type: type }, data || {});
          if (HOST) {
            HOST.postMessage(message);
            return Promise.resolve({});
          }
          try {
            return fetch('https://kcd2s-menu/' + type, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json; charset=UTF-8' },
              body: JSON.stringify(data || {}),
            }).then(function (r) {
              return r.json().catch(function () {
                return {};
              });
            });
          } catch (e) {
            return Promise.reject(e);
          }
        }

        // ---- state --------------------------------------------------------------------------------
        // list: 'loading' (no answer yet), 'ready', 'empty' (loaded, no servers), 'offline'.
        var state = {
          list: 'loading',
          servers: [],
          q: '',
          selected: null,
          error: '',
          showDetails: false,
          retryAt: 0,
          protocol: 1,
          gameVersion: '',
          dialog: null, // the open popup: { kind, server, ... }
          download: null, // { at, bytes }: the first progress report of this join, for the ETA
          lastJoin: null, // { id } or { address } to try again
          // A lost connection's message, shown once the game is back in this menu.
          disconnectNotice: null,
          queueSound: true,
        };
        try {
          state.selected = window.localStorage.getItem('kcds.lastServer');
          state.queueSound = window.localStorage.getItem('kcds.queueSound') !== 'off';
        } catch (e) {
          /* no storage */
        }

        var $ = function (id) {
          return document.getElementById(id);
        };

        // ---- scale the 1600x900 reference to the window -------------------------------------------
        function layout() {
          var scale = window.innerHeight / REFERENCE_HEIGHT;
          var stage = $('stage');
          stage.style.width = window.innerWidth / scale + 'px';
          stage.style.transform = 'scale(' + scale + ')';
        }
        window.addEventListener('resize', layout);
        layout();

        // ---- small DOM helpers (text only, never markup) ------------------------------------------
        function el(tag, className, text) {
          var node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined && text !== null) node.textContent = String(text);
          return node;
        }
        var SVG = 'http://www.w3.org/2000/svg';
        // Icons are fixed paths from the design; never data from a server.
        function icon(paths, size, stroke) {
          var svg = document.createElementNS(SVG, 'svg');
          svg.setAttribute('width', size);
          svg.setAttribute('height', size);
          svg.setAttribute('viewBox', '0 0 24 24');
          svg.setAttribute('fill', 'none');
          svg.setAttribute('stroke', 'currentColor');
          svg.setAttribute('stroke-width', stroke);
          svg.setAttribute('stroke-linecap', 'round');
          svg.setAttribute('stroke-linejoin', 'round');
          svg.setAttribute('aria-hidden', 'true');
          paths.forEach(function (d) {
            var path = document.createElementNS(SVG, 'path');
            path.setAttribute('d', d);
            svg.appendChild(path);
          });
          return svg;
        }
        var ICONS = {
          arrow: ['M5 12h14M13 6l6 6-6 6'],
          retry: ['M20 11a8 8 0 1 0-2.3 5.7', 'M20 4v7h-7'],
          close: ['M6 6l12 12M18 6 6 18'],
          tick: ['M5 12.5 10 17 19 7'],
          mic: ['M9 6a3 3 0 0 1 6 0v6a3 3 0 0 1-6 0z', 'M5 11a7 7 0 0 0 14 0', 'M12 18v4M8 22h8'],
          shield: ['M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z'],
          warning: ['M12 3 2 20h20z', 'M12 10v4M12 17.5v.01'],
          hourglass: ['M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9'],
          download: ['M12 4v11M7 10l5 5 5-5M5 20h14'],
          leave: ['M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10'],
          offline: [
            'M3 3l18 18',
            'M8 8a5 5 0 0 0-1 9.9h10.5M19.5 15.5A4 4 0 0 0 17 8h-.5A6 6 0 0 0 11 4.6',
          ],
        };
        function button(kind, label, iconName, onClick) {
          var node = el('button', 'btn ' + kind);
          node.type = 'button';
          node.appendChild(document.createTextNode(label));
          if (iconName) node.appendChild(icon(ICONS[iconName], 15, 2.2));
          node.addEventListener('click', onClick);
          return node;
        }

        // ---- server helpers -----------------------------------------------------------------------
        function isFull(s) {
          return s.maxPlayers > 0 && s.players >= s.maxPlayers;
        }
        function fill(s) {
          return s.maxPlayers > 0 ? Math.min(1, s.players / s.maxPlayers) : 0;
        }
        // Status color: red when full, amber from 80 %, green otherwise.
        function tone(s) {
          if (isFull(s)) return '#d0705a';
          return fill(s) >= 0.8 ? '#e0ac55' : '#9cbc6c';
        }
        function compatible(s) {
          return !s.protocol || s.protocol === state.protocol;
        }
        function gradient(s) {
          var h = 0;
          var text = String(s.id || s.name || s.address || '');
          for (var i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) & 0xffffff;
          var a = h % 360;
          var b = (a + 38) % 360;
          return (
            'radial-gradient(120% 90% at 50% 18%, hsl(' + a + ',30%,30%), hsl(' + b + ',36%,11%))'
          );
        }
        // Card art: the https image of the list entry over the server's heraldic gradient, which
        // stays when the image is missing or fails to load.
        function art(s, className) {
          var node = el('div', className);
          node.style.background = gradient(s);
          var url = s.image || s.img;
          if (typeof url === 'string' && /^https:\/\/[^\s"'()<>\\`]+$/.test(url)) {
            var img = document.createElement('img');
            img.alt = '';
            img.decoding = 'async';
            img.referrerPolicy = 'no-referrer';
            img.addEventListener('error', function () {
              img.remove();
            });
            img.src = url;
            node.appendChild(img);
          }
          return node;
        }
        function selectedServer() {
          for (var i = 0; i < state.servers.length; i++) {
            if (state.servers[i].id === state.selected) return state.servers[i];
          }
          return null;
        }

        // ---- lists: all, favourites and recent (kept in this game's own storage) -------------------
        // Tags come from the fixed list the master keeps (its KnownTags); a server carries some of
        // them, and the side panel filters by them.
        var TAGS = [
          'Roleplay',
          'PvP',
          'PvE',
          'Hardcore',
          'Whitelist',
          'Events',
          'Racing',
          'Siege',
          'Survival',
          'Freeroam',
          'Economy',
          'Beginner-friendly',
          'Voice chat',
          '18+',
        ];
        var MOST_RECENT = 12;
        var PING_FILTER_MS = 60;
        function stored(key) {
          try {
            var value = JSON.parse(window.localStorage.getItem(key) || '[]');
            return Array.isArray(value)
              ? value.filter(function (id) {
                  return typeof id === 'string';
                })
              : [];
          } catch (e) {
            return [];
          }
        }
        function store(key, list) {
          try {
            window.localStorage.setItem(key, JSON.stringify(list));
          } catch (e) {
            /* no storage */
          }
        }
        state.tab = 'all';
        state.favourites = stored('kcds.favourites');
        state.recent = stored('kcds.recent');
        state.filters = { players: false, notfull: false, ping: false };
        state.tags = [];
        // The row opened for more (one at a time); clicking it again closes it.
        state.open = null;
        function isFavourite(s) {
          return state.favourites.indexOf(s.id) >= 0;
        }
        function toggleFavourite(s) {
          state.favourites = isFavourite(s)
            ? state.favourites.filter(function (id) {
                return id !== s.id;
              })
            : state.favourites.concat([s.id]);
          store('kcds.favourites', state.favourites);
          render();
        }
        // A server joined goes first in Recent.
        function noteRecent(id) {
          state.recent = [id]
            .concat(
              state.recent.filter(function (other) {
                return other !== id;
              }),
            )
            .slice(0, MOST_RECENT);
          store('kcds.recent', state.recent);
        }
        function tagsOf(s) {
          return Array.isArray(s.tags)
            ? s.tags.filter(function (tag) {
                return TAGS.indexOf(tag) >= 0;
              })
            : [];
        }
        // The ping column and filter show once the list carries pings.
        function hasPing() {
          return state.servers.some(function (s) {
            return typeof s.ping === 'number' && isFinite(s.ping);
          });
        }
        function websiteOf(s) {
          var url = typeof s.website === 'string' ? s.website : '';
          return /^https?:\/\/[^\s"'()<>\\`@]+$/.test(url) ? url : '';
        }

        // ---- the connect button: the server chosen last --------------------------------------------
        // A row picked (or opened) chooses its server; the big button joins it. Its label names the
        // server's first word, as the design does.
        function renderDetail() {
          var ride = $('connect');
          var joining = state.dialog && state.dialog.kind === 'connecting';
          ride.classList.toggle('busy', !!joining);
          $('ride-busy').hidden = !joining;
          $('ride-arrow').style.display = joining ? 'none' : '';
          var s = selectedServer();
          if (joining) {
            ride.disabled = true;
            $('ridelabel').textContent = 'CONNECTING';
            return;
          }
          if (!s) {
            ride.disabled = true;
            $('ridelabel').textContent = 'CONNECT';
            return;
          }
          var word = String(s.name || '')
            .split(' — ')
            .pop()
            .split(' ')[0]
            .toUpperCase();
          ride.disabled = false;
          ride.title = s.name;
          if (!compatible(s)) {
            $('ridelabel').textContent = 'UPDATE REQUIRED';
          } else if (isFull(s) && s.queue) {
            $('ridelabel').textContent = 'QUEUE · ' + word;
          } else {
            $('ridelabel').textContent = 'CONNECT · ' + word;
          }
        }

        // ---- the list -------------------------------------------------------------------------------
        function view() {
          var q = state.q.trim().toLowerCase();
          var pool = state.servers;
          if (state.tab === 'favourites') {
            pool = pool.filter(isFavourite);
          } else if (state.tab === 'recent') {
            pool = state.recent
              .map(function (id) {
                return state.servers.filter(function (s) {
                  return s.id === id;
                })[0];
              })
              .filter(Boolean);
          }
          var shown = pool.filter(function (s) {
            var text = [s.name, s.address, s.description].join(' ').toLowerCase();
            if (q && text.indexOf(q) < 0) return false;
            if (state.filters.players && !(s.players > 0)) return false;
            if (state.filters.notfull && isFull(s)) return false;
            if (state.filters.ping && !(s.ping < PING_FILTER_MS)) return false;
            var tags = tagsOf(s);
            return state.tags.every(function (tag) {
              return tags.indexOf(tag) >= 0;
            });
          });
          // The most players first; Recent keeps the order they were joined in.
          if (state.tab !== 'recent') {
            shown.sort(function (a, b) {
              return (b.players || 0) - (a.players || 0);
            });
          }
          return shown;
        }

        function starIcon(on) {
          var svg = icon(
            ['M12 3.2l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 17l-5.4 2.9 1.1-6.1L3.2 9.6l6.1-.8z'],
            15,
            1.7,
          );
          if (on) svg.setAttribute('fill', 'currentColor');
          return svg;
        }

        function pingCell(s) {
          var cell = el('span', 'ping ping-col');
          if (typeof s.ping !== 'number') return cell;
          var bars = s.ping < 40 ? 4 : s.ping < 70 ? 3 : s.ping < 120 ? 2 : 1;
          var color = bars >= 3 ? '#9cbc6c' : bars === 2 ? '#e0ac55' : '#d0705a';
          var b = el('span', 'b');
          for (var i = 0; i < 4; i++) {
            var bar = el('i');
            bar.style.height = 4 + i * 3 + 'px';
            bar.style.background = i < bars ? color : 'rgba(255,255,255,.15)';
            b.appendChild(bar);
          }
          cell.appendChild(b);
          cell.appendChild(document.createTextNode(Math.round(s.ping) + ' ms'));
          return cell;
        }

        function playersCell(s) {
          var cell = el('div');
          var count = el('span', 'pl');
          count.appendChild(el('b', null, s.players));
          count.appendChild(document.createTextNode(' / ' + s.maxPlayers));
          cell.appendChild(count);
          if (isFull(s)) cell.appendChild(el('span', 'full-badge', 'FULL'));
          else if (s.password) cell.appendChild(el('span', 'full-badge locked', 'PASSWORD'));
          var bar = el('span', 'pbar');
          var fillBar = el('i');
          fillBar.style.width = Math.round(fill(s) * 100) + '%';
          fillBar.style.background = tone(s);
          bar.appendChild(fillBar);
          cell.appendChild(bar);
          return cell;
        }

        function tagList(s, className) {
          var box = el('div', className);
          tagsOf(s).forEach(function (tag) {
            box.appendChild(el('span', 'tag', tag));
          });
          return box;
        }

        // An opened row: the server's picture, its description, tags, address, version and website,
        // and Connect, Favourite and Open website.
        function expanded(s) {
          var box = el('div', 'xp');
          box.appendChild(art(s, 'xp-art'));
          var text = el('div');
          text.style.minWidth = '0';
          text.appendChild(el('p', null, s.description || 'The owner wrote no description.'));
          text.appendChild(tagList(s, 'tgs wrap'));
          var facts = el('div', 'kv');
          var version = s.version ? s.version : 'protocol ' + (s.protocol || '?');
          var rows = [
            ['Address', s.address],
            ['Map', s.map],
            [
              'Version',
              version + (compatible(s) ? ' · matches yours' : ' · needs another version'),
            ],
          ];
          var website = websiteOf(s);
          if (website) rows.push(['Website', website.replace(/^https?:\/\//, '')]);
          rows.forEach(function (pair) {
            if (!pair[1]) return;
            facts.appendChild(el('span', null, pair[0]));
            facts.appendChild(el('b', null, pair[1]));
          });
          text.appendChild(facts);
          box.appendChild(text);
          var actions = el('div', 'xp-actions');
          var label = !compatible(s)
            ? 'UPDATE REQUIRED'
            : isFull(s) && s.queue
            ? 'JOIN QUEUE'
            : 'CONNECT';
          var go = el('button', 'go');
          go.type = 'button';
          go.appendChild(document.createTextNode(label));
          go.appendChild(icon(ICONS.arrow, 15, 2.4));
          go.addEventListener('click', function (e) {
            e.stopPropagation();
            select(s.id);
            doConnect();
          });
          actions.appendChild(go);
          var fav = el(
            'button',
            'ghost',
            isFavourite(s) ? '★ IN FAVOURITES' : '☆ ADD TO FAVOURITES',
          );
          fav.type = 'button';
          fav.style.height = '40px';
          fav.addEventListener('click', function (e) {
            e.stopPropagation();
            toggleFavourite(s);
          });
          actions.appendChild(fav);
          if (website) {
            var web = el('button', 'ghost', 'OPEN WEBSITE');
            web.type = 'button';
            web.style.height = '40px';
            web.title = 'Opens ' + website + ' in your browser';
            web.appendChild(
              icon(
                ['M14 4h6v6M20 4l-9 9', 'M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5'],
                13,
                2,
              ),
            );
            web.addEventListener('click', function (e) {
              e.stopPropagation();
              send('website', { id: s.id });
            });
            actions.appendChild(web);
          }
          box.appendChild(actions);
          return box;
        }

        function row(s) {
          var open = state.open === s.id;
          var item = el('div', open ? 'it open' : 'it');
          item.setAttribute('role', 'listitem');
          item.dataset.id = s.id;
          var line = el('div', 'row');
          line.tabIndex = 0;
          line.setAttribute('aria-expanded', open ? 'true' : 'false');
          line.setAttribute('aria-label', s.name);
          var star = el('button', 'star');
          star.type = 'button';
          star.setAttribute('aria-pressed', isFavourite(s) ? 'true' : 'false');
          star.setAttribute('aria-label', 'Favourite');
          star.title = 'Add to or remove from favourites';
          star.appendChild(starIcon(isFavourite(s)));
          star.addEventListener('click', function (e) {
            e.stopPropagation();
            toggleFavourite(s);
          });
          line.appendChild(star);
          var who = el('div');
          who.style.minWidth = '0';
          var name = el('div', 'nm', s.name);
          name.title = s.name;
          who.appendChild(name);
          who.appendChild(el('div', 'ds', s.description || s.address));
          line.appendChild(who);
          line.appendChild(tagList(s, 'tgs'));
          line.appendChild(playersCell(s));
          line.appendChild(pingCell(s));
          var chev = el('span', 'chev');
          chev.appendChild(icon(['m9 6 6 6-6 6'], 14, 2.2));
          line.appendChild(chev);
          line.addEventListener('click', function () {
            state.open = open ? null : s.id;
            state.selected = s.id;
            render();
          });
          line.addEventListener('dblclick', function () {
            select(s.id);
            doConnect();

        function render() {
          var list = $('strip');
          var scroll = list.scrollTop;
          list.textContent = '';
          list.className = 'list';
          var loading = state.list === 'loading' && !state.servers.length;
          var blocked = loading || state.list === 'offline';
          $('fetching').hidden = !loading;
          $('searchbox').classList.toggle('dim', blocked);
          $('search').disabled = blocked;
          $('refresh').classList.toggle('spinning', state.list === 'loading');
          renderSide();

          if (loading) {
            $('count').textContent = '';
            list.className = 'list blocked';
            for (var i = 0; i < 8; i++) list.appendChild(el('div', 'skel skel-row'));
          } else if (state.list === 'offline') {
            $('count').textContent = '';
            list.className = 'list blocked';
            list.appendChild(offlineBlock());
          } else if (state.list === 'empty') {
            $('count').textContent = 'Showing 0 of 0';
            list.className = 'list blocked';
            list.appendChild(emptyBlock());
          } else {
            var shown = view();
            $('count').textContent = 'Showing ' + shown.length + ' of ' + state.servers.length;
            shown.forEach(function (s) {
              list.appendChild(row(s));
            });
            if (!shown.length) {
              list.appendChild(el('div', 'no-match', 'No server matches these filters.'));
            }

          state.retryAt = error ? Date.now() + OFFLINE_RETRY_SECONDS * 1000 : 0;
          if (state.selected && !selectedServer()) state.selected = null;
          if (!state.selected && servers.length) {

              servers.filter(function (s) {

        // labels: optional replacements, e.g. { 3: 'Syncing mods — 3 of 5' }.
        function stepList(active, failedAt, labels) {
          var list = el('div', 'steps');
          STEPS.forEach(function (label, index) {
            if (labels && labels[index]) label = labels[index];
            var row = el('div', 'step');
            var mark;
            if (failedAt !== undefined && index === failedAt) {
              row.className = 'step failed';
              mark = el('span', 'cross');
              mark.appendChild(icon(ICONS.close, 12, 2.6));
            } else if (index < active) {
              mark = el('span', 'tick');
              mark.appendChild(icon(ICONS.tick, 13, 2.6));
            } else if (index === active && failedAt === undefined) {
              row.className = 'step active';
              mark = el('span', 'step-ring spin');
            } else {
              row.className = 'step waiting';
              mark = el('span', 'step-dot');

            row.appendChild(mark);
            row.appendChild(el('span', '', label));
            list.appendChild(row);

        function megabytes(bytes) {
          return (bytes / 1048576).toFixed(1) + ' MB';
        }
        function timeLeft(seconds) {
          if (seconds < 1) return '';
          if (seconds < 90) return 'about ' + Math.ceil(seconds) + ' s left';
          return 'about ' + Math.ceil(seconds / 60) + ' min left';
        }
        // A determinate bar for the resource download: MB done of total and the time left, from the
        // rate since the first report of this join.
        function downloadProgress(p) {
          var now = Date.now();
          if (!state.download || p.bytesDone < state.download.bytes) {
            state.download = { at: now, bytes: p.bytesDone };
          }
          var elapsed = (now - state.download.at) / 1000;
          var rate = elapsed > 0.5 ? (p.bytesDone - state.download.bytes) / elapsed : 0;
          var left = rate > 0 ? timeLeft((p.bytesTotal - p.bytesDone) / rate) : '';
          var progress = el('div', 'progress');
          var track = el('div', 'track');
          var fill = el('div', 'fill');
          fill.style.width = Math.round((100 * p.bytesDone) / Math.max(p.bytesTotal, 1)) + '%';
          track.appendChild(fill);
          progress.appendChild(track);
          var text = el('div', 'progress-text');
          text.appendChild(
            el('span', '', megabytes(p.bytesDone) + ' of ' + megabytes(p.bytesTotal)),
          );
          text.appendChild(el('span', '', p.bytesDone >= p.bytesTotal ? '' : left));
          progress.appendChild(text);
          return progress;
        }
        function slidingProgress(left, right) {
          var progress = el('div', 'progress');
          var track = el('div', 'track');
          track.appendChild(el('div', 'slide'));
          progress.appendChild(track);
          var text = el('div', 'progress-text');
          text.appendChild(el('span', '', left));
          text.appendChild(el('span', '', right || ''));
          progress.appendChild(text);
          return progress;
        }
        // spec: { tone: ''|'amber'|'red', icon, eyebrow, title, closable, parts: [nodes],

          medallion.appendChild(holder);
          head.appendChild(medallion);

          titles.appendChild(el('div', 'deyebrow ' + (spec.tone || ''), spec.eyebrow));
          titles.appendChild(el('h2', 'dtitle', spec.title));
