        function emptyBlock() {
          var block = el('div', 'block');
          var inner = el('div', 'block-inner');
          inner.style.maxWidth = '600px';
          var mark = el('div', 'block-icon');
          mark.appendChild(icon(ICONS.shield, 30, 1.7));
          inner.appendChild(mark);
          var text = el('div', 'block-text');
          text.appendChild(el('div', 'block-title', 'No realms are open right now'));
          text.appendChild(
            el(
              'div',
              'block-body',
              'The list loaded, but no server is online. Refresh later, or host one yourself and connect to localhost.',
            ),
          );
          var actions = el('div', 'block-actions');
          actions.appendChild(button('secondary', 'REFRESH', 'retry', refresh));
          text.appendChild(actions);
          inner.appendChild(text);
          block.appendChild(inner);
          return block;
        }

        function render() {
          var strip = $('strip');
          strip.textContent = '';
          strip.className = 'strip';
          var loading = state.list === 'loading' && !state.servers.length;
          var blocked = loading || state.list === 'offline';
          $('fetching').hidden = !loading;
          $('searchbox').classList.toggle('dim', blocked);
          $('search').disabled = blocked;
          $('refresh').classList.toggle('spinning', state.list === 'loading');

          if (loading) {
            $('count').textContent = 'REALMS · …';
            strip.className = 'strip loading';
            for (var i = 0; i < 7; i++) strip.appendChild(el('div', 'skel skel-card'));
          } else if (state.list === 'offline') {
            $('count').textContent = 'REALMS · —';
            strip.className = 'strip blocked';
            strip.appendChild(offlineBlock());
          } else if (state.list === 'empty') {
            $('count').textContent = 'REALMS · 0 / 0';
            strip.className = 'strip blocked';
            strip.appendChild(emptyBlock());
          } else {
            var list = view();
            $('count').textContent = 'REALMS · ' + list.length + ' / ' + state.servers.length;
            if (!list.length) {
              strip.appendChild(
                el('div', 'no-match', 'No realm answers to “' + state.q.trim() + '”.'),
              );
            }
            list.forEach(function (s) {
              strip.appendChild(card(s));
            });
          }
          renderDetail();
        }

        function select(id) {
          state.selected = id;
          Array.prototype.forEach.call(document.querySelectorAll('.card'), function (c) {
            c.setAttribute('aria-pressed', c.dataset.id === id ? 'true' : 'false');
          });
          renderDetail();
        }

        function setServers(servers, error) {
          state.servers = servers;
          state.error = error || '';
          state.list = error ? 'offline' : servers.length ? 'ready' : 'empty';
          state.retryAt = error ? Date.now() + OFFLINE_RETRY_SECONDS * 1000 : 0;
          if (state.selected && !selectedServer()) state.selected = null;
          if (!state.selected && servers.length) {
            var first =
              servers.filter(function (s) {
                return compatible(s);
              })[0] || servers[0];
            state.selected = first.id;
          }
          render();
          if (state.dialog && state.dialog.kind === 'disconnected') return;
        }

        // Our product and its version (the client build), nothing else.
        function renderFooter() {
          var text = 'KCD2-Synced';
          if (state.version) text += ' · Version: ' + state.version;
          $('footer').textContent = text;
        }

        function secondsLeft() {
          return Math.max(0, Math.ceil((state.retryAt - Date.now()) / 1000));
        }

        // ---- popups -------------------------------------------------------------------------------
        // One anatomy (design manual 06): medallion, eyebrow, title, body, right-aligned footer.
        function serverRow(s) {
          var row = el('div', 'server-row');
          row.appendChild(art(s, 'thumb'));
          var text = el('div', 'row-text');
          text.appendChild(el('div', 'row-name', s.name || s.address));
          text.appendChild(el('div', 'row-host', s.address));
          row.appendChild(text);
          if (s.maxPlayers) {
            var pop = el('div', 'row-pop');
            pop.appendChild(el('span', 'num', s.players));
            pop.appendChild(document.createTextNode(' / ' + s.maxPlayers));
            row.appendChild(pop);
          }
          return row;
        }
        // labels: optional replacements, e.g. { 3: 'Syncing mods — 3 of 5' }.
        function stepList(active, failedAt, labels) {
          var list = el('div', 'steps');
          STEPS.forEach(function (label, index) {
            if (labels && labels[index]) label = labels[index];
            var row = el('div', 'step');
            var mark;
            if (failedAt !== undefined && index === failedAt) {
              row.className = 'step failed';
              mark = el('span', 'cross');
              mark.appendChild(icon(ICONS.close, 12, 2.6));
            } else if (index < active) {
              mark = el('span', 'tick');
              mark.appendChild(icon(ICONS.tick, 13, 2.6));
            } else if (index === active && failedAt === undefined) {
              row.className = 'step active';
              mark = el('span', 'step-ring spin');
            } else {
              row.className = 'step waiting';
              mark = el('span', 'step-dot');
            }
            row.appendChild(mark);
            row.appendChild(el('span', '', label));
            list.appendChild(row);
          });
          return list;
        }
        function megabytes(bytes) {
          return (bytes / 1048576).toFixed(1) + ' MB';
        }
        function timeLeft(seconds) {
          if (seconds < 1) return '';
          if (seconds < 90) return 'about ' + Math.ceil(seconds) + ' s left';
          return 'about ' + Math.ceil(seconds / 60) + ' min left';
        }
        // A determinate bar for the resource download: MB done of total and the time left, from the
        // rate since the first report of this join.
        function downloadProgress(p) {
          var now = Date.now();
          if (!state.download || p.bytesDone < state.download.bytes) {
            state.download = { at: now, bytes: p.bytesDone };
          }
          var elapsed = (now - state.download.at) / 1000;
          var rate = elapsed > 0.5 ? (p.bytesDone - state.download.bytes) / elapsed : 0;
          var left = rate > 0 ? timeLeft((p.bytesTotal - p.bytesDone) / rate) : '';
          var progress = el('div', 'progress');
          var track = el('div', 'track');
          var fill = el('div', 'fill');
          fill.style.width = Math.round((100 * p.bytesDone) / Math.max(p.bytesTotal, 1)) + '%';
          track.appendChild(fill);
          progress.appendChild(track);
          var text = el('div', 'progress-text');
          text.appendChild(
            el('span', '', megabytes(p.bytesDone) + ' of ' + megabytes(p.bytesTotal)),
          );
          text.appendChild(el('span', '', p.bytesDone >= p.bytesTotal ? '' : left));
          progress.appendChild(text);
          return progress;
        }
        function slidingProgress(left, right) {
          var progress = el('div', 'progress');
          var track = el('div', 'track');
          track.appendChild(el('div', 'slide'));
          progress.appendChild(track);
          var text = el('div', 'progress-text');
          text.appendChild(el('span', '', left));
          text.appendChild(el('span', '', right || ''));
          progress.appendChild(text);
          return progress;
        }
        // spec: { tone: ''|'amber'|'red', icon, eyebrow, title, closable, parts: [nodes],
        //         link: node, buttons: [nodes], focus: node }
        function openDialog(kind, spec, data) {
          state.dialog = Object.assign({ kind: kind }, data || {});
          var dialog = $('dialog');
          dialog.textContent = '';
          dialog.className = 'dialog' + (spec.className ? ' ' + spec.className : '');
          dialog.setAttribute('aria-label', spec.title);
          if (spec.closable) {
            var close = el('button', 'close');
            close.type = 'button';
            close.setAttribute('aria-label', 'Close');
            close.appendChild(icon(ICONS.close, 16, 2));
            close.addEventListener('click', closeDialog);
            dialog.appendChild(close);
          }
          var head = el('div', 'dhead');
          var medallion = el('div', 'medallion ' + (spec.tone || ''));
          var holder = el('span');
          holder.style.display = 'flex';
          holder.appendChild(icon(ICONS[spec.icon], 24, 1.8));
          medallion.appendChild(holder);
          head.appendChild(medallion);
          var titles = el('div', 'dtitles');
          titles.appendChild(el('div', 'deyebrow ' + (spec.tone || ''), spec.eyebrow));
          titles.appendChild(el('h2', 'dtitle', spec.title));
          head.appendChild(titles);
          dialog.appendChild(head);
          spec.parts.forEach(function (part) {
            if (part) dialog.appendChild(part);
          });
          var foot = el('div', 'dfoot');
          if (spec.link) foot.appendChild(spec.link);
          spec.buttons.forEach(function (b) {
            foot.appendChild(b);
          });
          dialog.appendChild(foot);
          $('scrim').hidden = false;
          renderDetail();
          var focus = spec.focus || spec.buttons[spec.buttons.length - 1];
          if (focus && !focus.disabled) focus.focus();
        }
        // Closes a popup that is a question (the ✕, Esc, Back, Not now, Later).
        function closeDialog() {
          var kind = state.dialog && state.dialog.kind;
          state.dialog = null;
          $('scrim').hidden = true;
          renderDetail();
          if (kind === 'queue' || kind === 'connecting') send('cancel');
          if (kind === 'bugReport') {
            $('stage').classList.remove('over-world');
            send('bugReportClose');
          }
        }
        function bodyText(text) {
          return el('p', 'dbody', text);
        }

        // The ESC menu's Report a bug, over the game world: what happened and the logs agreement.
        // Send hands it to the game, which sends it in the background; for now the dialog shows
        // the outcome (bugReportResult) until it is closed.
        function showBugReport() {
          $('stage').classList.add('over-world');
          var text = document.createElement('textarea');
          text.className = 'field bugtext';
          text.maxLength = 2000;
          text.rows = 6;
          text.placeholder = 'What happened, and what were you doing just before?';
          text.setAttribute('aria-label', 'What happened');
          var agree = document.createElement('input');
          agree.type = 'checkbox';
          var agreement = el('label', 'bugagree');
          agreement.appendChild(agree);
          agreement.appendChild(
            el('span', '', 'I agree to send my game and launcher logs with this report.'),
          );
          var note = el(
            'p',
            'dbody bugnote',
            'This form is for bugs in KCDS itself, not in a server\u2019s own scripts or rules: ' +
              'report those to the server\u2019s team. Abusing reports gets you banned from ' +
              'reporting.',
          );
          var sendButton = button('primary', 'SEND REPORT', null, function () {
            if (sendButton.disabled) return;
            send('bugReport', { text: text.value.trim(), accept: true });
            openDialog('bugReport', {
              tone: '',
              icon: 'hourglass',
              eyebrow: 'REPORT A BUG',
              title: 'Sending your report\u2026',
              closable: false,
              parts: [bodyText('Your report and logs are on their way to the KCDS team.')],
              buttons: [],
            });
          });
          sendButton.disabled = true;
          function update() {
            sendButton.disabled = text.value.trim().length < 3 || !agree.checked;
          }
          text.addEventListener('input', update);
          agree.addEventListener('change', update);
          openDialog('bugReport', {
            tone: '',
            icon: 'warning',
            eyebrow: 'REPORT A BUG',
            title: 'Report a bug in KCDS',
            closable: true,
            parts: [
              bodyText(
                'Tell the KCDS team what went wrong. Your report opens a ticket only the team sees.',
              ),
              text,
              agreement,
              note,
            ],
            buttons: [button('ghost', 'CANCEL', null, closeDialog), sendButton],
            focus: text,
          });
          // The game shows the page over the world only now.
          send('bugReportShown');
        }

        // A sent report's outcome (for now): sent, or not sent and why.
        function showBugReportResult(m) {
          if (!state.dialog || state.dialog.kind !== 'bugReport') return;
          var ok = m.ok === true;
          var why = typeof m.error === 'string' && m.error ? m.error : 'no answer';
          if (!ok && typeof m.status === 'number' && m.status > 0)
            why = 'HTTP ' + m.status + ': ' + why;
          openDialog('bugReport', {
            tone: ok ? '' : 'red',
            icon: ok ? 'shield' : 'warning',
            eyebrow: 'REPORT A BUG',
            title: ok ? 'Report sent' : 'Report not sent',
            closable: true,
            parts: [
              bodyText(
                ok
                  ? 'Thank you. The KCDS team has your report.'
                  : 'Your report could not be sent: ' + why + '.',
              ),
            ],
            buttons: [button('primary', 'CLOSE', null, closeDialog)],
          });
        }

        // progress: { resourcesDone, resourcesTotal, bytesDone, bytesTotal } while step 3 downloads.
        function showConnecting(s, step, progress) {
          var cancel = button('secondary', 'CANCEL', null, cancelJoin);
          // Once the server's world arrived the game loads it; there is nothing left to cancel.
          cancel.disabled = step >= 3;
          if (step === 0) state.download = null;
          var downloading = step === 3 && progress && progress.resourcesTotal > 0;
          var labels = downloading
            ? { 3: 'Syncing mods — ' + progress.resourcesDone + ' of ' + progress.resourcesTotal }
            : null;
          var bar =
            downloading && progress.bytesTotal > 0
              ? downloadProgress(progress)
              : slidingProgress(step >= 4 ? 'Loading the world…' : 'Waiting for the realm…', '');
          openDialog(
            'connecting',
            {
              icon: 'shield',
              eyebrow: 'RIDING OUT',
              title: 'Connecting to the realm',
              parts: [serverRow(s), stepList(step, undefined, labels), bar],
              buttons: [cancel],
            },
            { server: s, step: step },
          );
        }
        var FAILURE_TITLES = {
          timeout: 'The gates stayed shut',
          full: 'The realm is full',
          rejected: 'Turned away at the gates',
          admission: 'The gatekeeper did not answer',
          address: 'No such realm',
          internal: 'The ride could not begin',
          banned: 'Banished from every realm',
          password: 'The gate is locked',
          level: 'A land beyond your maps',
          licence: 'This copy cannot be verified',
          gameVersion: 'Your game is of another age',
          serverBanned: 'Banished from this realm',
          discord: 'The gatekeeper asks for your Discord',
        };
        // A server that lets in only verified Discord accounts: VERIFY DISCORD
        // opens Discord's sign-in in the browser; once verified, the same join again.
        function verifyDiscord() {
          if (BRIDGE) send('verifyDiscord');
        }
        function showDiscordState(m) {
          if (m.state === 'verified') {
            tryAgain();
            return;
          }
          var waiting = m.state === 'waiting';
          openDialog(
            'discord',
            {
              tone: waiting ? 'amber' : 'red',
              icon: waiting ? 'hourglass' : 'warning',
              eyebrow: 'DISCORD',
              title: waiting ? 'Allow KCDS in Discord' : 'Discord was not verified',
              closable: true,
              parts: [
                bodyText(
                  waiting
                    ? 'Discord asks you to allow KCDS: in the Discord app, or in your browser when the app is not running. Then come back here: the game joins again by itself.'
                    : m.message || 'The Discord sign-in did not finish.',
                ),
              ],
              buttons: waiting
                ? [button('ghost', 'BACK', null, closeDialog)]
                : [
                    button('ghost', 'BACK', null, closeDialog),
                    button('primary', 'VERIFY DISCORD', null, verifyDiscord),
                  ],
            },
            {},
          );
        }
        // The password a server asks for: a field and JOIN in the failure popup. The
        // game sends only a proof of it, made for that one connection.
        function passwordPart(onJoin) {
          var row = el('div', 'direct-row');
          var input = document.createElement('input');
          input.className = 'field';
          input.type = 'password';
          input.maxLength = 64;
          input.placeholder = 'Server password';
          input.autocomplete = 'off';
          input.setAttribute('aria-label', 'Server password');
          var join = el('button', 'ico join', 'JOIN');
          join.type = 'button';
          function submit() {
            if (input.value !== '') onJoin(input.value);
          }
          join.addEventListener('click', submit);
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') submit();
          });
          row.appendChild(input);
          row.appendChild(join);
          return { node: row, input: input };
        }
        function showPasswordAsk(s) {
          state.lastJoin = { id: s.id };
          var locked = passwordPart(joinWithPassword);
          openDialog(
            'password',
            {
              tone: '',
              icon: 'warning',
              eyebrow: 'PASSWORD',
              title: FAILURE_TITLES.password,
              closable: true,
              parts: [serverRow(s), bodyText('This server asks for a password.'), locked.node],
              buttons: [button('ghost', 'BACK', null, closeDialog)],
              focus: locked.input,
            },
            { server: s },
          );
        }
        function joinWithPassword(password) {
          var target = Object.assign({}, state.lastJoin, { password: password });
          state.dialog = null;
          $('scrim').hidden = true;
          if (target.address) {
            startJoin(target, { name: target.address, address: target.address }, false);
            return;
          }
          state.selected = target.id;
          var s = selectedServer();
          if (s) startJoin(target, s, false);
          else render();
        }
        function showFailed(m) {
          var s = m.server || {};
          var code = m.code ? el('div', 'code', m.code) : null;
          // The refusing server's own words (connection.reject), shown as text, never markup.
          var said = null;
          // Words our own text already says (the password request) are not repeated.
          var repeated = m.message && (m.reason || '').indexOf(m.message) === 0;
          if (m.message && !repeated) {
            said = el('div', 'reason-box');
            // A central ban's words come from the KCDS Master, not the server.
            said.appendChild(
              el(
                'div',
                'label',
                m.kind === 'banned' || m.kind === 'licence' || m.kind === 'gameVersion'
                  ? 'KCDS SAYS'
                  : 'THE REALM SAYS',
              ),
            );
            said.appendChild(el('div', 'value', m.message));
          }
          var locked = m.kind === 'password' ? passwordPart(joinWithPassword) : null;
          var copy = null;
          if (m.code) {
            copy = el('button', 'linkish', 'Copy details');
            copy.type = 'button';
            copy.addEventListener('click', function () {
              copyText(m.code, copy);
            });
          }
          openDialog(
            'failed',
            {
              tone: 'red',
              icon: 'warning',
              eyebrow: 'COULD NOT CONNECT',
              title: FAILURE_TITLES[m.kind] || FAILURE_TITLES.internal,
              closable: true,
              parts: [
                s.address ? serverRow(s) : null,
                bodyText(m.reason || 'The connection failed.'),
                said,
                locked ? locked.node : null,
                code,
                locked ? null : stepList(m.step || 0, m.step || 0),
              ],
              link: copy,
              // A ban turns every try away: no TRY AGAIN. A server asking for a verified Discord
              // account: VERIFY DISCORD instead.
              buttons:
                m.kind === 'discord'
                  ? [
                      button('ghost', 'BACK', null, closeDialog),
                      button('primary', 'VERIFY DISCORD', null, verifyDiscord),
                    ]
                  : locked || m.kind === 'serverBanned' || m.kind === 'banned'
                  ? [button('ghost', 'BACK', null, closeDialog)]
                  : [
                      button('ghost', 'BACK', null, closeDialog),
                      button('primary', 'TRY AGAIN', 'retry', tryAgain),
                    ],
              focus: locked ? locked.input : null,
            },
            { server: s },
          );
        }
        function showConfirmQueue(s) {
          var sound = el('label', 'check');
          var box = document.createElement('input');
          box.type = 'checkbox';
          box.checked = state.queueSound;
          box.addEventListener('change', function () {
            state.queueSound = box.checked;
            try {
              window.localStorage.setItem('kcds.queueSound', box.checked ? 'on' : 'off');
            } catch (e) {
              /* no storage */
            }
          });
          sound.appendChild(box);
          sound.appendChild(document.createTextNode('Play a sound when it is my turn'));
          openDialog(
            'confirmQueue',
            {
              tone: 'amber',
              icon: 'hourglass',
              eyebrow: 'REALM IS FULL',
              title: 'Wait at the gates?',
              closable: true,
              parts: [
                serverRow(s),
                bodyText(
                  'All ' +
                    s.maxPlayers +
                    ' places are taken. Join the queue and you will be connected when a place opens.',
                ),
                sound,
              ],
              buttons: [
                button('ghost', 'NOT NOW', null, closeDialog),
                button('primary', 'JOIN QUEUE', 'arrow', function () {
                  startJoin({ id: s.id }, s, true);
                }),
              ],
            },
            { server: s },
          );
        }
        function clock(seconds) {
          var m = Math.floor(seconds / 60);
          var s = seconds % 60;
          return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        }
        // EXIT GAME (top right of the list): asks first. A queue place or a download in progress is
        // named, because leaving gives it up.
        function showConfirmExit() {
          var parts = [bodyText('The game will close and you will return to your desktop.')];
          var running = state.dialog && state.dialog.kind;
          if (running === 'queue' || running === 'connecting') {
            var warn = el('div', 'exit-warn');
            var mark = el('span', 'exit-warn-icon');
            mark.appendChild(icon(ICONS.hourglass, 18, 1.9));
            warn.appendChild(mark);
            var lines = el('div', 'exit-warn-lines');
            var name = (state.dialog.server && state.dialog.server.name) || 'this realm';
            lines.appendChild(
              el(
                'div',
                'exit-warn-title',
                running === 'queue'
                  ? 'You are waiting in the queue for ' + name + '.'
                  : 'You are joining ' + name + '.',
              ),
            );
            lines.appendChild(el('div', 'exit-warn-note', 'Leaving now gives up your place.'));
            warn.appendChild(lines);
            parts.push(warn);
          }
          openDialog('exit', {
            tone: 'red',
            icon: 'leave',
            eyebrow: 'EXIT GAME',
            title: 'Leave the realm?',
            closable: true,
            parts: parts,
            buttons: [
              button('ghost', 'STAY', null, closeDialog),
              button('danger', 'EXIT GAME', 'leave', function () {
                send('quit');
              }),
            ],
          });
        }

        function showQueue(m) {
          var s = m.server || {};
          var figures = el('div', 'queue-figures');
          var place = el('div', 'figure');
          place.appendChild(el('span', 'value', m.place));
          place.appendChild(el('span', 'label', 'your place in line'));
          figures.appendChild(place);
          figures.appendChild(el('div', 'figure-sep'));
          var waited = el('div', 'figure');
          var timer = el('span', 'value', clock(m.waited || 0));
          waited.appendChild(timer);
          waited.appendChild(el('span', 'label', 'time waiting'));
          figures.appendChild(waited);
          // Server-provided lines: at most three label/value pairs, rendered as text.
          var fields = null;
          if (Array.isArray(m.fields) && m.fields.length) {
            fields = el('div', 'fields');
            m.fields.slice(0, 3).forEach(function (f) {
              var row = el('div', 'field-row');
              row.appendChild(el('span', 'field-label', String(f.label || '').slice(0, 32)));
              row.appendChild(el('span', 'field-value', String(f.value || '').slice(0, 96)));
              fields.appendChild(row);
            });
          }
          openDialog(
            'queue',
            {
              tone: 'amber',
              icon: 'hourglass',
              eyebrow: 'IN THE QUEUE',
              title: 'Waiting at the gates',
              parts: [
                serverRow(s),
                figures,
                fields,
                slidingProgress('Waiting for a free place…', 'Keep the game open'),
              ],
              buttons: [button('secondary', 'LEAVE QUEUE', null, cancelJoin)],
            },
            { server: s, waitedAt: Date.now() - (m.waited || 0) * 1000, timer: timer },
          );
        }
        function showUpdate(m) {
          var s = m.server || {};
          var versions = el('div', 'versions');
          var yours = el('div', 'version-card');
          yours.appendChild(el('div', 'label', 'Your version'));
          yours.appendChild(el('div', 'value', m.yours || '?'));
          versions.appendChild(yours);
          var required = el('div', 'version-card required');
          required.appendChild(el('div', 'label', 'Required'));
          required.appendChild(el('div', 'value', m.required || '?'));
          versions.appendChild(required);
          var newer = m.newer !== false;
          var buttons = newer
            ? [
                button('ghost', 'LATER', null, closeDialog),
                button('primary', 'UPDATE NOW', 'download', function () {
                  send('update');
                }),
              ]
            : [button('primary', 'BACK', null, closeDialog)];
          var note = el('p', 'dbody');
          note.appendChild(
            el(
              'span',
              'dnote',
              newer
                ? 'Update now closes the game and starts the KCDS launcher, which downloads the new version.'
                : 'Pick another realm, or try this one again once it has updated.',
            ),
          );
          openDialog(
            'update',
            {
              icon: 'download',
              eyebrow: 'UPDATE NEEDED',
              title: newer ? 'A new version is ready' : 'This realm runs an older version',
              closable: true,
              parts: [
                serverRow(s),
                bodyText(
                  newer
                    ? 'This realm runs a newer version of KCD2-Synced. The launcher needs to download it before you can join.'
                    : 'This realm has not updated to your version of KCD2-Synced yet.',
                ),
                versions,
                note,
              ],
              buttons: buttons,
            },
            { server: s },
          );
        }
        // A lost connection (server restart or shutdown, timeout, kick): the game leaves the world
        // at once, without asking, and the message waits for the menu.
        function onDisconnected(m) {
          state.disconnectNotice = m;
          state.dialog = null;
          $('scrim').hidden = true;
          send('back');
        }
        // What ended the session (m.cause): the dialog's eyebrow and title. A banned player is
        // not offered Reconnect: the server would turn them away.
        var DISCONNECT_TITLES = {
          lost: ['CONNECTION LOST', 'The connection was lost'],
          closed: ['THE REALM CLOSED', 'The realm closed its gates'],
          kicked: ['REMOVED FROM THE REALM', 'You were kicked'],
          left: ['DISCONNECTED', 'You left the realm'],
          quit: ['DISCONNECTED', 'You left the realm'],
          banned: ['BANISHED', 'You are banned from this realm'],
        };
        // The lost connection's message in the menu, with the server's reason, and Reconnect.
        function showDisconnected(m) {
          var s = m.server || {};
          var titles = DISCONNECT_TITLES[m.cause] || DISCONNECT_TITLES.lost;
          var banned = m.cause === 'banned';
          var body = el('p', 'dbody');
          body.appendChild(
            document.createTextNode(
              banned ? 'You were banished from ' : 'You were disconnected from ',
            ),
          );
          body.appendChild(el('span', 'em', s.name || s.address || 'the realm'));
          body.appendChild(document.createTextNode('.'));
          var reason = el('div', 'reason-box');
          reason.appendChild(el('div', 'label', 'REASON'));
          reason.appendChild(el('div', 'value', m.reason || 'The connection was lost.'));
          openDialog(
            'disconnected',
            {
              tone: 'red',
              icon: 'leave',
              eyebrow: titles[0],
              title: titles[1],
              closable: true,
              parts: [body, reason],
              buttons: banned
                ? [button('primary', 'CLOSE', null, closeDialog)]
                : [
                    button('ghost', 'CLOSE', null, closeDialog),
                    button('primary', 'RECONNECT', 'retry', tryAgain),
                  ],
            },
            { server: s },
          );
        }

        function copyText(text, from) {
          var done = function () {
            from.textContent = 'Copied';
          };
          try {
            navigator.clipboard.writeText(text).then(done, function () {
              legacyCopy(text);
              done();
            });
          } catch (e) {
            legacyCopy(text);
            done();
          }
        }
        function legacyCopy(text) {
          var area = document.createElement('textarea');
          area.value = text;
          document.body.appendChild(area);
          area.select();
          try {
            document.execCommand('copy');
          } catch (e) {
            /* nothing to do */
          }
          area.remove();
        }

        // ---- join flow ----------------------------------------------------------------------------
        function startJoin(target, s, queue) {
          state.lastJoin = target;
          if (target.id) {
            try {
              window.localStorage.setItem('kcds.lastServer', target.id);
            } catch (e) {
              /* no storage */
            }
          }
          showConnecting(s, 0);
          if (BRIDGE) {
            var password = target.password ? { password: target.password } : {};
            if (target.id)
              send('connect', Object.assign({ id: target.id, queue: !!queue }, password));
            else send('direct', Object.assign({ address: target.address }, password));
            return;
          }
          // Design preview: walk through the steps.
          [1, 2, 3].forEach(function (step) {
            setTimeout(function () {
              if (state.dialog && state.dialog.kind === 'connecting') showConnecting(s, step);
            }, step * 700);
          });
        }
        function doConnect() {
          var s = selectedServer();
          if (!s || (state.dialog && state.dialog.kind === 'connecting')) return;
          if (!compatible(s)) {
            showUpdate({
              server: s,
              yours: state.version || '',
              required: s.version || 'protocol v' + s.protocol,
              newer: s.protocol > state.protocol,
            });
            return;
          }
          if (isFull(s) && s.queue) {
            showConfirmQueue(s);
            return;
          }
          // A listed server that asks for a password: asked before the first try.
          if (s.password) {
            showPasswordAsk(s);
            return;
          }
          startJoin({ id: s.id }, s, false);
        }
        function directConnect(address) {
          address = String(address || '').trim();
          if (!address) return;
          if (!/^[A-Za-z0-9.-]+:\d{1,5}$/.test(address)) {
            $('direct').classList.add('error');
            $('direct-error').textContent = 'Add a port, e.g. ' + address.split(':')[0] + ':7777';
            $('direct-error').hidden = false;
            return;
          }
          $('direct').classList.remove('error');
          $('direct-error').hidden = true;
          startJoin({ address: address }, { name: address, address: address }, false);
        }
        function tryAgain() {
          var target = state.lastJoin;
          state.dialog = null;
          $('scrim').hidden = true;
          if (!target) return;
          if (target.address) {
            directConnect(target.address);
            return;
          }
          state.selected = target.id;
          var s = selectedServer();
          if (s) startJoin(target, s, false);
          else render();
        }
        function cancelJoin() {
          state.dialog = null;
          $('scrim').hidden = true;
          renderDetail();
          if (BRIDGE) send('cancel');
        }

        // ---- messages from the game ---------------------------------------------------------------
        // The progress object of a connecting message, with whole non-negative counts, or null.
        function progressOf(m) {
          var p = m.progress;
          if (!p || typeof p !== 'object') return null;
          var keys = ['resourcesDone', 'resourcesTotal', 'bytesDone', 'bytesTotal'];
          for (var i = 0; i < keys.length; i++) {
            if (!Number.isSafeInteger(p[keys[i]]) || p[keys[i]] < 0) return null;
          }
          return p;
        }
        function onMessage(e) {
          var m = e.data;
          if (!m || typeof m !== 'object') return;
          BRIDGE = true;
          if (m.type === 'bugReport') {
            showBugReport();
          } else if (m.type === 'bugReportResult') {
            showBugReportResult(m);
          } else if (m.type === 'discord') {
            showDiscordState(m);
          } else if (m.type === 'servers' && Array.isArray(m.servers)) {
            setServers(m.servers, typeof m.error === 'string' ? m.error : '');
          } else if (m.type === 'self') {
            if (typeof m.protocol === 'number') state.protocol = m.protocol;
            if (typeof m.version === 'string') state.version = m.version;
            if (typeof m.gameVersion === 'string') state.gameVersion = m.gameVersion;
            renderFooter();
            render();
          } else if (m.type === 'state') {
            var s = m.server || {};
            // A join the game started (a kcds:// join link): TRY AGAIN and a password
            // go to the same server.
            if (m.state === 'connecting' && !state.lastJoin && (s.id || s.address)) {
              state.lastJoin = s.id ? { id: s.id } : { address: s.address };
            }
            if (m.state === 'connecting') showConnecting(s, Number(m.step) || 0, progressOf(m));
            else if (m.state === 'failed') showFailed(m);
            else if (m.state === 'update') showUpdate(m);
            else if (m.state === 'queue') showQueue(m);
            else if (m.state === 'disconnected') onDisconnected(m);
            else if (m.state === 'ingame') showConnecting(s, 4);
            else if (m.state === 'browsing') {
              // Back from a server's world: the list again, with the lost connection's message
              // when that was why.
              state.dialog = null;
              $('scrim').hidden = true;
              renderDetail();
              var notice = state.disconnectNotice;
              state.disconnectNotice = null;
              if (notice) showDisconnected(notice);
            }
          }
        }
        if (HOST) HOST.addEventListener('message', onMessage);
        else window.addEventListener('message', onMessage);

        // ---- controls -----------------------------------------------------------------------------
        $('search').addEventListener('input', function (e) {
          state.q = e.target.value;
          $('clear').hidden = !e.target.value;
          render();
        });
        $('clear').addEventListener('click', function () {
          state.q = '';
          $('search').value = '';
          $('clear').hidden = true;
          render();
          $('search').focus();
        });
        $('connect').addEventListener('click', doConnect);
        $('directbtn').addEventListener('click', function () {
          directConnect($('direct').value);
        });
        $('direct').addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            directConnect($('direct').value);
          }
        });
        $('direct').addEventListener('input', function () {
          $('direct').classList.remove('error');
          $('direct-error').hidden = true;
        });
        $('localhost').addEventListener('click', function () {
          directConnect(LOCALHOST);
        });

        function refresh() {
          state.showDetails = false;
          state.list = 'loading';
          render();
          if (BRIDGE) {
            send('refresh');
            return;
          }
          setTimeout(function () {
            setServers(sampleServers(), '');
          }, 600);
        }
        $('refresh').addEventListener('click', refresh);
        $('exitgame').addEventListener('click', showConfirmExit);
        // The tools: the game starts again in the Asset/Animation Studio or in World
        // Architect, on this PC only, with no server.
        $('toolstudio').addEventListener('click', function () {
          send('tool', { tool: 'studio' });
        });
        $('toolarchitect').addEventListener('click', function () {
          send('tool', { tool: 'architect' });
        });
        // The list stays live while no popup is open; an unavailable list retries on its countdown.
        setInterval(function () {
          if (!BRIDGE || document.hidden || state.dialog) return;
          if (state.list === 'ready' || state.list === 'empty') send('refresh');
        }, AUTO_REFRESH_MS);
        setInterval(function () {
          if (state.dialog && state.dialog.kind === 'queue' && state.dialog.timer) {
            state.dialog.timer.textContent = clock(
              Math.floor((Date.now() - state.dialog.waitedAt) / 1000),
            );
          }
          if (state.list !== 'offline') return;
          var left = secondsLeft();
          if ($('retry-count')) $('retry-count').textContent = left + ' s';
          if (left === 0) refresh();
        }, 250);

        // Keyboard: arrows pick a realm, Enter joins, F5 refreshes, Escape closes a popup that is
        // a question or cancels a join. Text fields keep their own keys.
        function move(step) {
          var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
          if (!cards.length) return;
          var index = cards.findIndex(function (c) {
            return c.dataset.id === state.selected;
          });
          var next = cards[Math.max(0, Math.min(cards.length - 1, index + step))];
          select(next.dataset.id);
          next.scrollIntoView({ block: 'nearest', inline: 'nearest' });
          next.focus();
        }
        document.addEventListener('keydown', function (e) {
          var target = e.target || {};
          var typing = target.tagName === 'INPUT' && target.type === 'text';
          // A focused button acts on Enter even when the key arrives without its character.
          if (
            e.key === 'Enter' &&
            target.tagName === 'BUTTON' &&
            !target.classList.contains('card')
          ) {
            e.preventDefault();
            if (!target.disabled) target.click();
            return;
          }
          if (e.key === 'Escape') {
            e.preventDefault();
            if (state.dialog) {
              if (state.dialog.kind === 'connecting') {
                if (state.dialog.step < 3) cancelJoin();
              } else if (state.dialog.kind === 'queue') {
                cancelJoin();
              } else {
                closeDialog();
              }
            } else if (typing) {
              target.blur();
            }
            return;
          }
          if (e.key === 'F5') {
            e.preventDefault();
            if (!state.dialog) refresh();
            return;
          }
          if (typing || state.dialog) return;
          if (e.key === 'ArrowRight') {
            e.preventDefault();
            move(1);
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            move(-1);
          } else if (
            e.key === 'Enter' &&
            (target.tagName !== 'BUTTON' || target.classList.contains('card'))
          ) {
            e.preventDefault();
            doConnect();
          }
        });

        // ---- sample data, design preview outside the game only ------------------------------------
        function sampleServers() {
          var now = new Date().toISOString();
          return [
            ['trosky', 'Trosky Roleplay', 'rp.example.com:7777', 148, 200, false],
            ['sasau', 'Sasau Monastery RP', 'eu3.example.com:7777', 66, 100, false],
            ['pribyslavitz', 'Pribyslavitz Siege', 'eu4.example.com:7777', 54, 64, false],
            ['skalitz', 'Skalitz Racing', 'na.example.com:7777', 32, 32, true],
            ['kuttenberg', 'Kuttenberg Tournament', 'eu2.example.com:7777', 31, 32, false],
            ['rattay', 'Rattay Freeroam', 'play.example.com:7777', 12, 32, false],
            [
              'ledetchko',
              'Ledetchko Village of the Black Riders — Hardcore Roleplay',
              'rp.example.com:7777',
              21,
              64,
              false,
            ],
            ['merhojed', 'Merhojed Homestead', 'eu.example.com:7777', 5, 48, false],
          ].map(function (row) {
            return {
              id: row[0],
              name: row[1],
              address: row[2],
              players: row[3],
              maxPlayers: row[4],
              queue: row[5],
              map: 'trosecko',
              protocol: state.protocol,
              lastSeen: now,
            };
          });
        }
        // Preview of every frame without the game: index.html?frame=<name>.
        function previewFrame(name) {
          var s = sampleServers()[0];
          var full = sampleServers()[3];
          if (name === 'loading') return;
          if (name === 'offline') {
            setServers([], 'could not reach the master server');
            return;
          }
          if (name === 'empty') {
            setServers([], '');
            return;
          }
          setServers(sampleServers(), '');
          if (name === 'connecting') {
            state.download = { at: Date.now() - 4000, bytes: 0 };
            showConnecting(s, 3, {
              resourcesDone: 3,
              resourcesTotal: 5,
              bytesDone: 19293798,
              bytesTotal: 31037849,
            });
          }
          if (name === 'failed')
            showFailed({
              server: s,
              kind: 'timeout',
              step: 0,
              reason:
                'The server did not answer in time. It may be restarting, or your firewall is blocking the game.',
              code: s.address + ' · timed out',
            });
          if (name === 'rejected')
            showFailed({
              server: s,
              kind: 'rejected',
              step: 2,
              reason: 'The server turned you away: one of its scripts refused the connection.',
              code: s.address + ' · refused: playerConnecting',
              message: 'Whitelist only. Apply on our Discord: discord.gg/example',
            });
          if (name === 'confirmQueue') showConfirmQueue(full);
          if (name === 'queue')
            showQueue({
              server: full,
              place: 4,
              waited: 161,
              fields: [{ label: 'Priority', value: 'Supporter' }],
            });
          if (name === 'update')
            showUpdate({ server: s, yours: '0.1.1', required: '0.1.2', newer: true });
          if (name === 'disconnected')
            showDisconnected({ server: s, reason: 'The server stopped answering 10 seconds ago.' });
        }

        // ---- boot ---------------------------------------------------------------------------------
        renderFooter();
        render();
        send('ready').catch(function () {
          /* no bridge: design preview */
        });
        setTimeout(function () {
          if (BRIDGE || state.servers.length) return;
          var frame = (window.location.search.match(/frame=([A-Za-z]+)/) || [])[1];
          if (frame) previewFrame(frame);
          else setServers(sampleServers(), '');
        }, 400);
      })();
    </script>
  </body>
</html>
