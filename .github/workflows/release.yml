name: release

# A KCDS release, built on Linux: the Windows client with clang-cl and xwin
# (Dev/docker/windows/Dockerfile), the Linux server (Dev/docker/server/Dockerfile) and the server's
# Docker image. Servers are hosted on Linux only.
#
# Only a v<version> tag on a commit of main releases, and only the repository's owner can push to
# main or create a v tag (repository rulesets). The run then:
#   1. checks the tag is on main, names the version the build has (CMakeLists.txt VERSION) and is
#      annotated: its message is the release notes, shown on the GitHub release and in Discord;
#   2. runs every check of a pull request (ci.yml);
#   3. builds the client (with the launcher from the private repository KCD-Synced/KCDS-Launcher),
#      the server and the KCDS-Types download, and scans them on VirusTotal;
#      A hotfix (a version of four numbers, 1.0.1.1: CMakeLists.txt VERSION's fourth) skips the
#      VirusTotal scan, the slow step after the build: it publishes once the build and the checks
#      pass;
#   4. waits for the owner's approval (the `release` environment), then publishes: the GitHub
#      release with every download, the image ghcr.io/kcd-synced/kcds-server:<version> and :latest,
#      the signed launcher update feed and the server update channel, and the Discord post
#      (Dev/tools/release/publish.py).
# Run by hand (Actions > release > Run workflow) it builds and scans only; nothing is published.
#
# Environment `build` (main and v tags only): KCDS_LOGO_DDS_HEADER (base64 of the game logo's
# 128-byte DDS header), KCDS_BUILD_SECRET (the handshake key's build secret), KCDS_CRASH_DSN (the
# crash server's client DSN, required: every release reports its crashes), KCDS_SYMBOLS_TOKEN (a
# GlitchTip token with project:write, for the release's debug symbols; v tags only),
# KCDS_LAUNCHER_DEPLOY_KEY (read-only deploy key of KCDS-Launcher), VIRUSTOTAL_API_KEY.
# Environment `release` (v tags only, the owner approves every run): KCDS_RELEASE_SSH (user@host
# of the release host), KCDS_RELEASE_SSH_KEY, KCDS_RELEASE_KNOWN_HOSTS, KCDS_UPDATE_SIGNING_KEY
# (the update feed's Ed25519 private key, PEM), KCDS_DISCORD_WEBHOOK, KCDS_MASTER_DEPLOY_KEY
# (read-only deploy key of KCDS-Master);
# optional CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: kcds-release

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      hotfix: ${{ steps.version.outputs.hotfix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The build's version
        id: version
        run: |
          version="$(tr -d '\r' < CMakeLists.txt | sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' | head -1)"
          if [ -z "$version" ]; then
            echo "no VERSION in CMakeLists.txt"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Four numbers: a hotfix of the release named by the first three.
          if [ "$(printf '%s' "$version" | tr -cd '.' | wc -c)" -eq 3 ]; then
            echo "hotfix=true" >> "$GITHUB_OUTPUT"
          else
            echo "hotfix=false" >> "$GITHUB_OUTPUT"
          fi
      - name: A release tag is on main and names the build's version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME is not a commit of main: releases come from main only"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "$GITHUB_REF_NAME does not name the build's version $VERSION"
            exit 1
          fi
          # The release notes are the annotated tag's message (git tag -a v<version> -F notes.md).
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != "tag" ]; then
            echo "$GITHUB_REF_NAME is not an annotated tag: its message is the release notes"
            exit 1
          fi
          if [ -z "$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | tr -d '[:space:]')" ]; then
            echo "$GITHUB_REF_NAME has no message: its message is the release notes"
            exit 1
          fi

  checks:
    needs: gate
    uses: ./.github/workflows/ci.yml

  image:
    needs: gate
    runs-on: ubuntu-24.04
    environment: build
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image
        env:
          KCDS_BUILD_SECRET: ${{ secrets.KCDS_BUILD_SECRET }}
          KCD2S_BUILD_SALT: ${{ vars.KCD2S_BUILD_SALT }}
        run: |
          if [ -z "${KCDS_BUILD_SECRET:-}" ]; then
            echo "KCDS_BUILD_SECRET is not set (environment build)"
            exit 1
          fi
          secrets="$(mktemp -d)"
          printf '%s' "$KCDS_BUILD_SECRET" > "$secrets/build-secret"
          docker build -f Dev/docker/server/Dockerfile \
            --build-arg "KCD2S_BUILD_SALT=${KCD2S_BUILD_SALT:-}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.licenses=PolyForm-Strict-1.0.0" \
            --secret "id=build_secret,src=$secrets/build-secret" -t kcds-server:build .
          rm -rf "$secrets"
          docker save kcds-server:build | gzip > kcds-server-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: kcds-server-image
          path: kcds-server-image.tar.gz
          retention-days: 7

  zips:
    needs: gate
    runs-on: ubuntu-24.04
    environment: build
    steps:
      - uses: actions/checkout@v4
      - name: The launcher (private repository)
        uses: actions/checkout@v4
        with:
          repository: KCD-Synced/KCDS-Launcher
          ssh-key: ${{ secrets.KCDS_LAUNCHER_DEPLOY_KEY }}
          path: Client/launcher/private
      - name: Build the zips
        env:
          KCDS_LOGO_DDS_HEADER: ${{ secrets.KCDS_LOGO_DDS_HEADER }}
          KCDS_CRASH_DSN: ${{ secrets.KCDS_CRASH_DSN }}
          KCDS_BUILD_SECRET: ${{ secrets.KCDS_BUILD_SECRET }}
          KCD2S_BUILD_SALT: ${{ vars.KCD2S_BUILD_SALT }}
        run: |
          # Every release reports its crashes: a build without the crash DSN is refused, not
          # quietly built without reports.
          for name in KCDS_LOGO_DDS_HEADER KCDS_BUILD_SECRET KCDS_CRASH_DSN; do
            if [ -z "${!name:-}" ]; then
              echo "$name is not set (environment build)"
              exit 1
            fi
          done
          secrets="$(mktemp -d)"
          printf '%s' "$KCDS_LOGO_DDS_HEADER" | base64 -d > "$secrets/logo-header"
          printf '%s' "$KCDS_BUILD_SECRET" > "$secrets/build-secret"
          printf '%s' "$KCDS_CRASH_DSN" > "$secrets/sentry-dsn"
          docker build -f Dev/docker/windows/Dockerfile --target package \
            --secret "id=logo_header,src=$secrets/logo-header" \
            --secret "id=sentry_dsn,src=$secrets/sentry-dsn" \
            --secret "id=build_secret,src=$secrets/build-secret" \
            --build-arg "UPDATE_ORIGIN=https://updates.kcdsynced.com" \
            --build-arg "KCD2S_BUILD_SALT=${KCD2S_BUILD_SALT:-}" \
            --output dist .
          # The same build's binaries with their PDBs (the layers are the package's), for the
          # crash server's symbols below.
          docker build -f Dev/docker/windows/Dockerfile --target binaries \
            --secret "id=sentry_dsn,src=$secrets/sentry-dsn" \
            --secret "id=build_secret,src=$secrets/build-secret" \
            --build-arg "KCD2S_BUILD_SALT=${KCD2S_BUILD_SALT:-}" \
            --output symbols .
          docker build -f Dev/docker/server/Dockerfile --target package \
            --build-arg "KCD2S_BUILD_SALT=${KCD2S_BUILD_SALT:-}" \
            --secret "id=build_secret,src=$secrets/build-secret" --output dist .
          rm -rf "$secrets"
          cat dist/SHA256SUMS.txt dist/SHA256SUMS-linux.txt
      - name: The zips name the build's version
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          if [ ! -f "dist/KCDS-Client-$VERSION.zip" ]; then
            echo "no KCDS-Client-$VERSION.zip in the build"
            ls dist
            exit 1
          fi
          if ! unzip -l "dist/KCDS-Client-$VERSION.zip" | grep -q "kcds-launcher.exe"; then
            echo "the client zip has no launcher"
            exit 1
          fi
          # The crash reports are on in the release (the launcher hands the DSN to the game).
          if ! unzip -p "dist/KCDS-Client-$VERSION.zip" "KCDS-Client-$VERSION/kcds-launcher.json" |
            python3 -c 'import json, sys; sys.exit(0 if json.load(sys.stdin)["sentry"]["enabled"] else 1)'; then
            echo "the client zip has crash reporting off"
            exit 1
          fi
      # A release's crash reports show function names, files and lines: its binaries' PDBs go to
      # the crash server (GlitchTip), never into the zips. Tags only: a build run by hand is not
      # a release.
      - name: Debug symbols to the crash server
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KCDS_SYMBOLS_TOKEN: ${{ secrets.KCDS_SYMBOLS_TOKEN }}
        run: |
          if [ -z "${KCDS_SYMBOLS_TOKEN:-}" ]; then
            echo "KCDS_SYMBOLS_TOKEN is not set (environment build)"
            exit 1
          fi
          token="$(mktemp)"
          printf '%s' "$KCDS_SYMBOLS_TOKEN" > "$token"
          python3 Dev/tools/release/upload_symbols.py --build symbols --token-file "$token"
          rm -f "$token"
      - uses: actions/upload-artifact@v4
        with:
          name: kcds-release-zips
          path: dist/
          retention-days: 30

  virustotal:
    needs: [gate, zips]
    # A hotfix goes out without the scan (see the top).
    if: needs.gate.outputs.hotfix != 'true'
    runs-on: ubuntu-24.04
    environment: build
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kcds-release-zips
          path: dist
      - name: Scan on VirusTotal
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: python3 Dev/tools/release/virustotal_scan.py --dist dist --out virustotal
      - name: The report in the run's summary
        if: always()
        run: |
          if [ -f virustotal/virustotal.md ]; then
            cat virustotal/virustotal.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kcds-virustotal-report
          path: virustotal/
          retention-days: 90

  publish:
    needs: [gate, checks, image, zips, virustotal]
    # Every job passed; the scan may have been skipped for a hotfix.
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !cancelled() &&
      needs.gate.result == 'success' && needs.checks.result == 'success' &&
      needs.image.result == 'success' && needs.zips.result == 'success' &&
      (needs.virustotal.result == 'success' ||
       (needs.virustotal.result == 'skipped' && needs.gate.outputs.hotfix == 'true'))
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      packages: write
      # GitHub's build provenance: a Sigstore-signed statement that this workflow of this public
      # repository built each download and the image, from the tagged commit
      # (`gh attestation verify <file> --repo KCD-Synced/KCDS`).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      # The update feed's publisher (the private repository KCD-Synced/KCDS-Master).
      - uses: actions/checkout@v4
        with:
          repository: KCD-Synced/KCDS-Master
          ssh-key: ${{ secrets.KCDS_MASTER_DEPLOY_KEY }}
          path: System-Backend
      - uses: actions/download-artifact@v4
        with:
          name: kcds-release-zips
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: kcds-server-image
          path: image
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Every download's provenance, before anything is published: a failed attestation publishes
      # nothing.
      - name: Attest the downloads
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Publish the server image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kcds-server"
          gunzip -c image/kcds-server-image.tar.gz | docker load
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag kcds-server:build "$image:$VERSION"
          docker tag kcds-server:build "$image:latest"
          docker push "$image:$VERSION"
          docker push "$image:latest"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$VERSION")"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      # The image's provenance, by its digest, stored beside the image in the registry.
      - name: Attest the server image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Publish the release
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          KCDS_RELEASE_SSH: ${{ secrets.KCDS_RELEASE_SSH }}
          KCDS_RELEASE_SSH_KEY: ${{ secrets.KCDS_RELEASE_SSH_KEY }}
          KCDS_RELEASE_KNOWN_HOSTS: ${{ secrets.KCDS_RELEASE_KNOWN_HOSTS }}
          KCDS_UPDATE_SIGNING_KEY: ${{ secrets.KCDS_UPDATE_SIGNING_KEY }}
          KCDS_DISCORD_WEBHOOK: ${{ secrets.KCDS_DISCORD_WEBHOOK }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          KCDS_GITHUB_TOKEN: ${{ github.token }}
          KCDS_RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for name in KCDS_RELEASE_SSH KCDS_RELEASE_SSH_KEY KCDS_RELEASE_KNOWN_HOSTS \
              KCDS_UPDATE_SIGNING_KEY KCDS_DISCORD_WEBHOOK; do
            if [ -z "${!name:-}" ]; then
              echo "$name is not set (environment release)"
              exit 1
            fi
          done
          secrets="$(mktemp -d)"
          umask 077
          printf '%s\n' "$KCDS_RELEASE_SSH_KEY" > "$secrets/ssh-key"
          printf '%s\n' "$KCDS_UPDATE_SIGNING_KEY" > "$secrets/update-signing-key.pem"
          printf '%s' "$KCDS_DISCORD_WEBHOOK" > "$secrets/discord-webhook"
          mkdir -p ~/.ssh
          printf '%s\n' "$KCDS_RELEASE_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          # The release notes: the annotated tag's message.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$secrets/notes.md"
          KCDS_RELEASE_SSH_KEY_FILE="$secrets/ssh-key" \
          KCDS_UPDATE_SIGNING_KEY_FILE="$secrets/update-signing-key.pem" \
          KCDS_DISCORD_WEBHOOK_FILE="$secrets/discord-webhook" \
            python3 Dev/tools/release/publish.py --version "$VERSION" --dist dist \
              --ref "$GITHUB_SHA" --notes "$secrets/notes.md"
          rm -rf "$secrets"
