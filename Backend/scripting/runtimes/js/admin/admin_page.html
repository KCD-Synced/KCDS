          const choices = [
            ['all', `All ${bans.length}`],
            ['active', `Active ${active}`],
            ['expired', `Ended ${bans.length - active}`],
          ];
          chips.replaceChildren(
            ...choices.map(([id, label]) =>
              h('button', {
                type: 'button',
                class: 'chip',
                text: label,
                'aria-pressed': String(filter === id),
                onClick: () => {
                  filter = id;
                  draw();
                },
              }),
            ),
          );
          const shown = bans.filter(
            (ban) => filter === 'all' || (filter === 'active' ? ban.active : !ban.active),
          );
          if (shown.length === 0) {
            body.replaceChildren(
              emptyState(
                'bans',
                bans.length === 0 ? 'No bans' : 'No ban here',
                'Bans made from Players, or added here by hand, are listed with who made them.',
              ),
            );
            return;
          }
          body.replaceChildren(bansTable(shown), bansCards(shown));

              h(
                'div',
                { class: 'ph' },
                chips,
                h('span', {
                  class: 'muted2',
                  text: 'Banned players see: “You are banned from this server: <reason>. Until <date> UTC.”',

              ),

            ),

          load: () => api('GET', '/api/bans'),
          update(list) {

            const active = String(list.filter((ban) => ban.active).length);
            if (state.counts.bans !== active) {

              renderNav();
            }
            draw();
          },
        };

      function addBanDialog() {
        const identifiers = h('textarea', {
          id: 'dialog-identifiers',

          rows: '3',
          placeholder: 'steam:7656119...\nhardware:...',
        });
        const reason = h('input', {

          type: 'text',
          placeholder: 'Banned from this server.',

        const length = banLength();
        dialog({
          title: 'Add a ban',
          sub: 'Ban identifiers by hand, for players who are not online.',
          icon: 'bans',
          button: 'Add ban',
          body: [
            field(
              'Identifiers',
              identifiers,
              '1 to 8, one per line: steam:…, epic:…, xbox:…, gog:…, discord:…, hardware:… or ip:…',
            ),
            field('Reason', reason, 'Shown to them on every join attempt.'),
            length.node,
            banPreview(reason, length),
          ],
          confirm: async () => {

            const valid = /^(steam|epic|xbox|gog|discord|hardware|ip):[A-Za-z0-9._:-]{1,128}$/;

              identifiers: list,
              reason: reason.value.trim(),

      // -- Console --

      function logLine(line) {
        const text = String(line.text);
        const admin = text.startsWith('KCDS-Admin');
        const error = /\b(error|failed|crash(ed)?|exception)\b/i.test(text) || /^\s+at /.test(text);
        let className = 'll';
        if (error) {
          className += ' err';
        } else if (admin) {
          className += ' adminact';
        }
        let sourceClass = 'src';
        if (admin) {
          sourceClass += ' web';
        } else if (line.source === 'host') {
          sourceClass += ' host';
        }
        return h(
          'div',
          { class: className },
          h(
            'span',
            { class: 'meta' },
            h('span', { class: 'tm', text: utcTime(line.time, true) }),
            h('span', { class: sourceClass, text: admin ? 'KCDS-Admin' : line.source }),
          ),
          h('span', { class: 'tx', text }),
        );
      }

      function consoleView() {
        const log = h('div', { class: 'log', role: 'log', 'aria-live': 'off' });
        const live = liveTag(true);
        const pausedText = h('span');
        const pauseBar = h(
          'div',
          { class: 'pausebar', role: 'status', hidden: true },
          h(
            'span',
            { style: 'display: flex; align-items: center; gap: 8px' },
            icon('pause', 15, 2.4),
            h('b', { text: 'Paused' }),
            pausedText,
          ),
          button('Jump to newest', {
            size: 'xs',
            onClick: () => {
              log.scrollTop = log.scrollHeight;
            },
          }),
        );
        let after = 0;
        let unseen = 0;
        const atBottom = () => log.scrollTop + log.clientHeight >= log.scrollHeight - 6;
        log.addEventListener('scroll', () => {
          if (atBottom()) {
            unseen = 0;
            pauseBar.hidden = true;
            live.dataset.paused = '0';
          } else {
            live.dataset.paused = '1';
          }
          renderLive(live);
        });
        let footer;
        if (isOwner()) {
          const command = h('input', {
            type: 'text',
            placeholder: 'Command, for example: restart freeroam',
            autocomplete: 'off',
          });
          footer = h(
            'form',
            {
              class: 'cmd',
              onSubmit: async (event) => {
                event.preventDefault();
                const text = command.value.trim();
                if (!text) {
                  return;
                }
                try {
                  await api('POST', '/api/command', { text });
                  command.value = '';
                  toast('Command sent', `${text}: its output shows in the log.`);
                  refresh();
                } catch (error) {
                  failed(error);
                }
              },
            },
            h(
              'label',
              { class: 'field' },
              h('span', {
                class: 'mono',
                style: 'color: var(--accent)',
                'aria-hidden': 'true',
                text: '›',
              }),
              h('span', { class: 'sr', text: 'Server command (owner only)' }),
              command,
            ),
            button('Run', { kind: 'primary', submit: true }),
          );
        } else {
          footer = h(
            'div',
            { class: 'cmd', style: 'color: var(--text-muted); font-size: 14px' },
            icon('lock', 15, 2.2),
            'Commands are owner-only. You can read the log.',
          );
        }
        return {
          nodes: [
            pageHead('Console', { side: live }),
            h(
              'section',
              { class: 'panel', 'aria-label': 'Server log', style: 'overflow: hidden' },
              log,
              pauseBar,
              footer,
            ),
          ],
          load: () => api('GET', `/api/log?after=${after}`),
          update(data) {
            if (data.lines.length === 0) {
              return;
            }
            const follow = atBottom();
            for (const line of data.lines) {
              log.append(logLine(line));
              after = line.seq;
            }
            while (log.childElementCount > 2000) {
              log.firstChild.remove();
            }
            if (follow) {
              log.scrollTop = log.scrollHeight;
            } else {
              unseen += data.lines.length;
              pausedText.textContent = ` while you scroll up · ${unseen} new line${
                unseen === 1 ? '' : 's'
              }`;
              pauseBar.hidden = false;
            }
          },
        };
      }

      // -- Settings --

      // The settings of where the server and this admin listen, edited into server.json.
      const NETWORK_SETTINGS = [
        {
          key: 'port',
          label: 'Game port (UDP)',
          kind: 'port',
          fallback: '7777',
          hint: 'Players connect to it.',
        },
        {
          key: 'bind',
          label: 'The game listens on',
          kind: 'bind',
          fallback: '127.0.0.1',
          hint: 'Every interface for players from other computers.',
        },
        {
          key: 'adminPort',
          label: 'KCDS-Admin port (TCP)',
          kind: 'port',
          fallback: '',
          hint: 'This page. Empty turns KCDS-Admin off.',
        },
        {
          key: 'adminBind',
          label: 'KCDS-Admin listens on',
          kind: 'bind',
          fallback: '127.0.0.1',
          hint: 'Only this computer is the safe default; use HTTPS for the internet.',
        },
        {
          key: 'httpPort',
          label: "Status API and resources' HTTP port (TCP)",
          kind: 'port',
          fallback: '',
          hint: 'info.json and players.json. Empty turns it off.',
        },
      ];

      function settingsView() {
        const editor = h('textarea', {
          id: 'settings-editor',
          class: 'editor',
          spellcheck: 'false',
          'aria-describedby': 'settings-error',
        });
        const error = h('p', { id: 'settings-error', class: 'ferr', role: 'alert', hidden: true });
        const where = h('span', { class: 'muted2' });
        const listen = h('p', { class: 'muted2' });
        const fields = h('div', { class: 'frow2' });
        const networkError = h('p', { class: 'ferr', role: 'alert', hidden: true });
        let saved = '';
        const inputs = new Map();

        const parse = () => {
          try {
            const value = JSON.parse(editor.value);
            if (!value || typeof value !== 'object' || Array.isArray(value)) {
              return { error: 'server.json is one JSON object' };
            }
            return { value };
          } catch (problem) {
            return { error: `not valid JSON: ${problem.message}` };
          }
        };
        const showError = (text) => {
          editor.setAttribute('aria-invalid', String(Boolean(text)));
          error.hidden = !text;
          error.replaceChildren(icon('alert', 16, 2.2), h('span', { text: `Not saved. ${text}` }));
        };
        // The fields show what the editor holds.
        const readFields = () => {
          const parsed = parse();
          if (!parsed.value) {
            return;
          }
          for (const setting of NETWORK_SETTINGS) {
            const input = inputs.get(setting.key);
            const value = parsed.value[setting.key];
            const text = value === undefined || value === null ? '' : String(value);
            if (setting.kind === 'bind') {
              const known = ['', '127.0.0.1', '0.0.0.0'].includes(text);
              input.custom.hidden = known;
              input.custom.value = known ? '' : text;
              input.custom.textContent = known ? '' : text;
              input.value = text;
            } else {
              input.value = text;
            }
          }
        };
        // A field's change is written into the editor's JSON.
        const writeField = (setting, raw) => {
          networkError.hidden = true;
          const parsed = parse();
          if (!parsed.value) {
            networkError.replaceChildren(
              icon('alert', 16, 2.2),
              h('span', { text: `Fix server.json below first: ${parsed.error}.` }),
            );
            networkError.hidden = false;
            readFields();
            return;
          }
          const text = raw.trim();
          if (text === '') {
            delete parsed.value[setting.key];
          } else if (setting.kind === 'port') {
            const number = Number(text);
            if (!Number.isInteger(number) || number < 1 || number > 65535) {
              networkError.replaceChildren(
                icon('alert', 16, 2.2),
                h('span', { text: `${setting.label}: a whole number from 1 to 65535.` }),
              );
              networkError.hidden = false;
              return;
            }
            parsed.value[setting.key] = number;
          } else {
            parsed.value[setting.key] = text;
          }
          editor.value = `${JSON.stringify(parsed.value, null, 2)}\n`;
          showError('');
        };

        for (const setting of NETWORK_SETTINGS) {
          const id = `settings-${setting.key}`;
          let input;
          if (setting.kind === 'bind') {
            const custom = h('option', { value: '', hidden: true });
            input = h(
              'select',
              { id, class: 'inp' },
              h('option', { value: '', text: `Not set (${setting.fallback})` }),
              h('option', { value: '127.0.0.1', text: '127.0.0.1 — only this computer' }),
              h('option', { value: '0.0.0.0', text: '0.0.0.0 — every network interface' }),
              custom,
            );
            input.custom = custom;
            input.addEventListener('change', () => writeField(setting, input.value));
          } else {
            input = h('input', {
              id,
              class: 'inp mono',
              inputmode: 'numeric',
              placeholder: setting.fallback ? `${setting.fallback} when empty` : 'off when empty',
            });
            input.addEventListener('change', () => writeField(setting, input.value));
          }
          inputs.set(setting.key, input);
          fields.append(field(setting.label, input, setting.hint));
        }
        editor.addEventListener('input', () => {
          showError('');
          readFields();
        });

        const save = async (restart) => {
          const parsed = parse();
          if (!parsed.value) {
            showError(parsed.error);
            toast('Not saved', parsed.error, true);
            return;
          }
          try {
            await api('PUT', '/api/config', { text: editor.value });
            saved = editor.value;
            if (restart) {
              await api('POST', '/api/server/restart', { minutes: 1 });
              toast('Saved', 'The server restarts in 1 minute with the new settings.');
              refresh();
            } else {
              toast('Saved', 'server.json saved. It applies at the next start.');
            }
          } catch (problem) {
            if (problem.status === 400) {
              showError(problem.message);
            }
            failed(problem);
          }
        };

        return {
          once: true,
          nodes: [
            pageHead('Settings', { owner: true }),
            h(
              'div',
              { class: 'banner bn-note' },
              h('span', { class: 'ic' }, icon('info', 20)),
              h(
                'div',
                { class: 'tx' },
                h('span', {
                  text:
                    'Settings apply at the next start. Save, then restart when it suits your players, or use “Save and restart in 1 minute”. ' +
                    'A command-line option or an environment variable with the same setting wins over server.json.',
                }),
              ),
            ),
            h(
              'section',
              { class: 'panel', 'aria-labelledby': 'settings-network' },
              h(
                'div',
                { class: 'ph' },
                h(
                  'div',
                  { class: 'l' },
                  icon('network', 18),
                  h('h2', { id: 'settings-network', text: 'Where the server listens' }),
                ),
                listen,
              ),
              h(
                'div',
                { class: 'pb stack' },
                fields,
                networkError,
                h('p', {
                  class: 'muted2',
                  text:
                    'A change here is written into server.json below; Save it. After a new KCDS-Admin port or ' +
                    'address the page answers there after the restart: open it and sign in again. The admin ' +
                    'password and HTTPS files (adminPassword, adminTlsCert, adminTlsKey) are set in server.json too.',
                }),
              ),
            ),
            h(
              'section',
              { class: 'panel', 'aria-labelledby': 'settings-file', style: 'overflow: hidden' },
              h(
                'div',
                { class: 'ph' },
                h(
                  'div',
                  { class: 'l' },
                  h('h2', {
                    id: 'settings-file',
                    class: 'mono',
                    style: 'font-size: 16px',
                    text: 'server.json',
                  }),
                  where,
                ),
              ),
              h('label', { class: 'sr', for: editor.id, text: 'server.json contents' }),
              editor,
              h(
                'div',
                { class: 'stack', style: 'gap: 12px; padding: 14px 18px' },
                error,
                h(
                  'div',
                  { class: 'row' },
                  button('Save', { kind: 'primary', onClick: () => save(false) }),
                  button('Save and restart in 1 minute', {
                    icon: 'restart',
                    onClick: () => save(true),
                  }),
                  button('Undo changes', {
                    kind: 'ghost',
                    onClick: () => {
                      editor.value = saved;
                      showError('');
                      networkError.hidden = true;
                      readFields();
                    },
                  }),
                ),
              ),
            ),
          ],
          load: () => api('GET', '/api/config'),
          update(config) {
            saved = config.text;
            editor.value = config.text;
            where.textContent = config.exists
              ? config.path
              : `${config.path} (not there yet; Save makes it)`;
            const at = state.session.listen;
            listen.textContent = `This page now answers on ${at.scheme}://${at.bind}:${at.port}/`;
            readFields();
          },
        };
      }

      // -- Backups --

      function backupsView() {
        const body = h('div');
        let working = false;
        let backups = [];
        const draw = () => {
          if (backups.length === 0 && !working) {
            body.replaceChildren(
              emptyState(
                'backups',
                'No backups yet',
                'Make one now, or one is made before the next planned restart.',
              ),
            );
            return;
          }
          const table = h('div', {
            class: 'dt',
            role: 'table',
            'aria-label': 'Backups',
            style: 'grid-template-columns: minmax(0, 1fr) 110px',
          });
          table.append(
            h(
              'div',
              { class: 'tr', role: 'row' },
              h('span', { class: 'th', role: 'columnheader', text: 'Name (date-time, UTC)' }),
              h('span', { class: 'th r', role: 'columnheader', text: 'Size' }),
            ),
          );
          if (working) {
            const spinner = icon('spinner', 15, 2.2);
            spinner.classList.add('spin');
            table.append(
              h(
                'div',
                { class: 'tr', role: 'row' },
                h(
                  'span',
                  { class: 'td', role: 'cell' },
                  h(
                    'span',
                    { style: 'display: flex; align-items: center; gap: 10px' },
                    spinner,
                    h('b', { text: 'Backing up…' }),
                  ),
                ),
                h('span', { class: 'td r muted2', role: 'cell', text: '—' }),
              ),
            );
          }
          for (const [index, backup] of backups.entries()) {
            table.append(
              h(
                'div',
                { class: 'tr', role: 'row' },
                h(
                  'span',
                  { class: 'td mono', role: 'cell', style: 'font-size: 14px' },
                  backup.name,
                  index === 0
                    ? h('span', {
                        class: 'badge b-gold',
                        style: 'margin-left: 8px',
                        text: 'newest',
                      })
                    : null,
                ),
                h('span', { class: 'td r mono', role: 'cell', text: size(backup.bytes) }),
              ),
            );
          }
          body.replaceChildren(table);
        };
        const now = button('Back up now', {
          kind: 'primary',
          icon: 'backups',
          onClick: async () => {
            working = true;
            now.disabled = true;
            draw();
            try {
              const made = await api('POST', '/api/backups');
              const skipped = made.skipped?.length
                ? ` (${made.skipped.length} big files left out)`
                : '';
              toast('Backup made', `${made.name}${skipped}`);
            } catch (error) {
              failed(error);
            } finally {
              working = false;
              now.disabled = false;
              refresh();
            }
          },
        });
        return {
          nodes: [
            pageHead('Backups', { owner: true, side: now }),
            h('p', {
              class: 'muted',
              text:
                "The resources folder (your resources' data, without node_modules), server.json and the bans, " +
                'in backups/ next to the resources folder. One is also made before every planned restart. ' +
                'The newest 10 are kept; older ones are removed.',
            }),
            h('section', { class: 'panel', 'aria-label': 'Backups' }, body),
          ],
          load: () => api('GET', '/api/backups'),
          update(list) {
            backups = list;
            draw();
          },
        };
      }

      // -- Crash reports --

      function crashesView() {
        const body = h('div');
        return {
          nodes: [
            pageHead('Crash reports', {
              owner: true,
              side: h('span', { class: 'muted2', text: 'The newest 20 are kept' }),
            }),
            h('section', { class: 'panel', 'aria-label': 'Crash reports' }, body),
          ],
          load: () => api('GET', '/api/crashes'),
          update(reports) {
            if (reports.length === 0) {
              body.replaceChildren(
                emptyState(
                  'check',
                  'No crashes',
                  'When the server ends without stopping in order, a report with its last 200 log lines appears here.',
                ),
              );
              return;
            }
            const table = h('div', {
              class: 'dt',
              role: 'table',
              'aria-label': 'Crash reports',
              style: 'grid-template-columns: minmax(240px, 1.4fr) 190px 160px 160px 100px',
            });
            table.append(
              h(
                'div',
                { class: 'tr', role: 'row' },
                ['Name', 'Kind', 'Started (UTC)', 'Ended (UTC)'].map((label) =>
                  h('span', { class: 'th', role: 'columnheader', text: label }),
                ),
                h(
                  'span',
                  { class: 'th', role: 'columnheader' },
                  h('span', { class: 'sr', text: 'Open' }),
                ),
              ),
            );
            for (const report of reports) {
              table.append(
                h(
                  'div',
                  { class: 'tr', role: 'row' },
                  h('span', {
                    class: 'td mono',
                    role: 'cell',
                    style: 'font-size: 14px; font-weight: 600',
                    text: report.name,
                  }),
                  h(
                    'span',
                    { class: 'td', role: 'cell' },
                    h('span', { class: 'badge b-bad' }, icon('alert', 11, 2.8), report.kind),
                  ),
                  h('span', { class: 'td mono', role: 'cell', text: utc(report.startedAt) }),
                  h('span', { class: 'td mono', role: 'cell', text: utc(report.endedAt) }),
                  h(
                    'span',
                    { class: 'td r', role: 'cell' },
                    h(
                      'button',
                      {
                        type: 'button',
                        class: 'btn btn-secondary btn-xs',
                        onClick: () => go('crash', report.name),
                      },
                      'Open',
                      icon('right', 13, 2.2),
                    ),
                  ),
                ),
              );
            }
            const cards = h(
              'div',
              { class: 'mlist show-m' },
              reports.map((report) =>
                h(
                  'div',
                  { class: 'mcard' },
                  h(
                    'div',
                    { class: 'mrow' },
                    h('span', {
                      class: 'mono',
                      style: 'font-weight: 700; overflow-wrap: anywhere',
                      text: report.name,
                    }),
                  ),
                  h('span', {
                    class: 'badge b-bad',
                    style: 'align-self: flex-start',
                    text: report.kind,
                  }),
                  h('span', {
                    class: 'muted2 mono',
                    text: `${utc(report.startedAt)} → ${utc(report.endedAt)}`,
                  }),
                  button('Open', {
                    size: 'xs',
                    style: 'width: 100%',
                    onClick: () => go('crash', report.name),
                  }),
                ),
              ),
            );
            body.replaceChildren(h('div', { class: 'hide-m' }, table), cards);
          },
        };
      }

      function crashView() {
        const name = state.crash;
        const details = h('dl', { class: 'kvl' });
        const kind = h('span');
        const log = h('div', { class: 'log', style: 'height: 380px' });
        return {
          once: true,
          nodes: [
            h(
              'button',
              {
                type: 'button',
                class: 'btn btn-ghost btn-sm',
                style: 'align-self: flex-start; padding: 0',
                onClick: () => go('crashes'),
              },
              icon('left', 15, 2.2),
              'Crash reports',
            ),
            pageHead(name, {
              owner: true,
              eyebrow: 'Crash report',
              titleStyle: 'font-family: var(--f-mono); font-size: 22px; overflow-wrap: anywhere',
              side: kind,
            }),
            h('section', { class: 'panel' }, h('div', { class: 'pb' }, details)),
            h(
              'section',
              { class: 'panel', 'aria-label': 'Last log lines', style: 'overflow: hidden' },
              h(
                'div',
                { class: 'ph' },
                h('h2', { text: 'Last log lines' }),
                h('span', { class: 'muted2', text: 'ending where the run ended' }),
              ),
              log,
            ),
          ],
          load: () => api('GET', `/api/crashes/${encodeURIComponent(name)}`),
          update(report) {
            kind.replaceChildren(
              h('span', { class: 'badge b-bad' }, icon('alert', 11, 2.8), report.kind),
            );
            const started = toDate(report.startedAt);
            const ended = toDate(report.endedAt);
            const rows = [
              ['Kind', report.kind],
              ['Started', `${utc(report.startedAt, true)} UTC`],
              ['Ended', `${utc(report.endedAt, true)} UTC`],
              ['Ran for', started && ended ? duration((ended - started) / 1000) : '—'],
              ['Details', report.detail || '—'],
            ];
            details.replaceChildren(
              ...rows.flatMap(([label, value]) => [
                h('dt', { text: label }),
                h('dd', { text: value }),
              ]),
            );
            const lines = Array.isArray(report.log) ? report.log : [];
            log.replaceChildren(...lines.map((line) => logLine(line)));
            if (lines.length === 0) {
              log.replaceChildren(
                h(
                  'div',
                  { class: 'll' },
                  h('span', { class: 'tx', text: 'The report kept no log lines.' }),
                ),
              );
            }
            log.scrollTop = log.scrollHeight;
          },
        };
      }

      // -- Updates --

      function updatesView() {
        const banner = h('div', { class: 'stack', style: 'gap: 12px' });
        const details = h('dl', { class: 'kvl' });
        const check = button('Check for updates', {
          icon: 'restart',
          onClick: async () => {
            check.disabled = true;
            try {
              const found = await api('POST', '/api/updates/check');
              state.update = { ...found, at: Date.now() };
              renderWho();
              toast(
                'Checked',
                found.newer
                  ? `Release ${found.release} is out.`
                  : `Newest release is ${found.release}, the same as this server.`,
              );
              await refreshView(view);
            } catch (error) {
              failed(error);
            } finally {
              check.disabled = false;
            }
          },
        });
        const view = {
          once: true,
          nodes: [
            pageHead('Updates', { owner: true }),
            banner,
            h(
              'section',
              { class: 'panel', 'aria-labelledby': 'updates-server' },
              h(
                'div',
                { class: 'ph' },
                h('h2', { id: 'updates-server', text: 'This server' }),
                check,
              ),
              h('div', { class: 'pb' }, details),
            ),
          ],
          load: () => api('GET', '/api/updates'),
          update(updates) {
            const found = state.update;
            const banners = [];
            check.disabled = !updates.available;
            if (!updates.available) {
              banners.push(
                h(
                  'div',
                  { class: 'banner bn-warn' },
                  h('span', { class: 'ic' }, icon('alert', 22)),
                  h(
                    'div',
                    { class: 'tx' },
                    h('b', { text: 'Updates are unavailable' }),
                    h('span', { class: 'muted2', text: capital(updates.reason) }),
                  ),
                ),
              );
            } else if (updates.staged) {
              banners.push(
                h(
                  'div',
                  { class: 'banner bn-note' },
                  h('span', { class: 'ic' }, icon('updates', 22)),
                  h(
                    'div',
                    { class: 'tx' },
                    h('b', { text: `Downloaded: KCDS ${updates.staged}` }),
                    h('span', { class: 'muted2', text: 'It is installed at the next restart.' }),
                  ),
                ),
              );
            } else if (found?.newer) {
              banners.push(
                h(
                  'div',
                  { class: 'banner bn-note' },
                  h('span', { class: 'ic' }, icon('updates', 24)),
                  h(
                    'div',
                    { class: 'tx' },
                    h('b', { text: `Update ready: KCDS ${found.release}` }),
                    h('span', {
                      class: 'muted2',
                      text: `Newer than this server (${updates.current}). Installing downloads it, then restarts into it after a delay you choose; players are warned in chat.`,
                    }),
                  ),
                  button(`Install ${found.release}`, {
                    kind: 'primary',
                    onClick: () => installDialog(found.release),
                  }),
                ),
              );
            } else if (found) {
              banners.push(
                h(
                  'div',
                  { class: 'banner bn-note bn-ok' },
                  h('span', { class: 'ic' }, icon('check', 22, 2.4)),
                  h(
                    'div',
                    { class: 'tx' },
                    h('b', { text: 'Up to date' }),
                    h('span', {
                      class: 'muted2',
                      text: `Newest release is ${found.release}, the same as this server.`,
                    }),
                  ),
                ),
              );
            }
            banner.replaceChildren(...banners);
            banner.hidden = banners.length === 0;
            const rows = [
              ['Current version', updates.current || '—'],
              ['Update channel', updates.channel || '—'],
              [
                'Newest release',
                found
                  ? `${found.release}${found.newer ? ' · newer' : ' · same as this server'}`
                  : 'not checked yet',
              ],
              ['Last checked', found ? `${utc(found.at)} UTC` : '—'],
            ];
            details.replaceChildren(
              ...rows.flatMap(([label, value]) => [
                h('dt', { text: label }),
                h('dd', { text: value }),
              ]),
            );
          },
        };
        return view;
      }

      function installDialog(release) {
        const when = whenPicker('Restart into it', 5);
        dialog({
          title: `Install KCDS ${release}?`,
          sub: 'Downloads the update, then restarts into it.',
          icon: 'updates',
          button: `Install and restart ${whenWords(5)}`,
          body: [
            when.node,
            h('p', {
              class: 'muted2',
              style: 'font-size: 14px',
              text: 'Players are warned in chat before the restart. A backup is made first.',
            }),
          ],
          confirm: async () => {
            const minutes = when.minutes();
            const done = await api('POST', '/api/updates/install', { minutes });
            state.update = null;
            renderWho();
            return [
              'Update downloaded',
              `KCDS ${done.release} installs; the server restarts ${whenWords(minutes)}.`,
            ];
          },
        });
        when.onChange = (minutes) => {
          $('dialog').querySelector(
            '.dlg-f .btn:last-child',
          ).textContent = `Install and restart ${whenWords(minutes)}`;
        };
      }

      // -- Accounts --

      function accountsView() {
        const list = h('div', {
          class: 'dt',
          role: 'table',
          'aria-label': 'Accounts',
          style: 'grid-template-columns: minmax(0, 1fr) auto auto',
        });
        const name = h('input', {
          id: 'account-name',
          class: 'inp',
          type: 'text',
          autocomplete: 'off',
        });
        const password = h('input', {
          id: 'account-password',
          class: 'inp',
          type: 'password',
          autocomplete: 'new-password',
        });
        const form = h(
          'form',
          {
            class: 'panel',
            'aria-labelledby': 'account-add',
            onSubmit: async (event) => {
              event.preventDefault();
              try {
                await api('POST', '/api/accounts', {
                  name: name.value.trim(),
                  password: password.value,
                });
                toast('Moderator saved', `${name.value.trim()} can sign in now.`);
                name.value = '';
                password.value = '';
                refresh();
              } catch (error) {
                failed(error);
              }
            },
          },
          h('div', { class: 'ph' }, h('h2', { id: 'account-add', text: 'Add a moderator' })),
          h(
            'div',
            { class: 'pb stack', style: 'gap: 14px' },
            field(
              'Name',
              name,
              '2 to 32 letters, digits, _ . or -. An existing name gets the new password.',
            ),
            field(
              'Password',
              password,
              '8 to 128 bytes. Moderators see Status, Players, Bans and the Console log, and message, teleport, kick and ban.',
            ),
            button('Save moderator', {
              kind: 'primary',
              submit: true,
              style: 'align-self: flex-start',
            }),
          ),
        );
        return {
          nodes: [
            pageHead('Accounts', { owner: true }),
            h(
              'div',
              { class: 'cols2' },
              h('section', { class: 'panel', 'aria-label': 'Accounts' }, list),
              form,
            ),
          ],
          load: () => api('GET', '/api/accounts'),
          update(accounts) {
            list.replaceChildren(
              h(
                'div',
                { class: 'tr', role: 'row' },
                h('span', { class: 'th', role: 'columnheader', text: 'Name' }),
                h('span', { class: 'th', role: 'columnheader', text: 'Role' }),
                h(
                  'span',
                  { class: 'th', role: 'columnheader' },
                  h('span', { class: 'sr', text: 'Remove' }),
                ),
              ),
            );
            for (const account of accounts) {
              const owner = account.role === 'owner';
              list.append(
                h(
                  'div',
                  { class: 'tr', role: 'row' },
                  h(
                    'span',
                    { class: 'td', role: 'cell' },
                    h('b', { text: account.name }),
                    account.name === state.session.name
                      ? h('span', { class: 'muted2', text: ' (you)' })
                      : null,
                  ),
                  h(
                    'span',
                    { class: 'td', role: 'cell' },
                    h('span', {
                      class: owner ? 'badge b-gold' : 'badge',
                      text: owner ? 'Owner' : 'Moderator',
                    }),
                  ),
                  h(
                    'span',
                    { class: 'td r', role: 'cell' },
                    owner
                      ? null
                      : button('Remove', {
                          size: 'xs',
                          kind: 'danger',
                          onClick: () => removeAccountDialog(account),
                        }),
                  ),
                ),
              );
            }
          },
        };
      }

      function removeAccountDialog(account) {
        dialog({
          title: `Remove ${account.name}?`,
          sub: 'Their moderator account is deleted and their session ends at once.',
          icon: 'trash',
          bad: true,
          button: 'Remove account',
          body: [
            h('p', {
              class: 'muted2',
              style: 'font-size: 14px',
              text: 'Bans and log lines they made stay.',
            }),
          ],
          confirm: async () => {
            await api('DELETE', `/api/accounts/${encodeURIComponent(account.name)}`);
            return ['Account removed', `${account.name} was signed out and removed.`];
          },
        });
      }

      // ---- sign-in ----

      function signInBanner(iconName, title, text) {
        const banner = $('signin-banner');
        banner.className = 'banner bn-bad';
        banner.setAttribute('role', 'alert');
        banner.replaceChildren(
          h('span', { class: 'ic' }, icon(iconName, 20)),
          h('div', { class: 'tx' }, h('b', { text: title }), h('span', { class: 'muted2', text })),
        );
        banner.hidden = false;
      }

      $('signin-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const name = $('signin-name');
        const password = $('signin-password');
        name.removeAttribute('aria-invalid');
        password.removeAttribute('aria-invalid');
        $('signin-banner').hidden = true;
        $('signin-button').disabled = true;
        try {
          const session = await api('POST', '/api/login', {
            name: name.value.trim(),
            password: password.value,
          });
          showApp(session);
          refresh();
        } catch (error) {
          if (error.status === 429) {
            const seconds = Number(error.data?.retryAfter) || 300;
            signInBanner(
              'lock',
              'Too many failed sign-ins.',
              `Wait ${Math.ceil(seconds / 60)} minute${
                seconds > 60 ? 's' : ''
              }, then try again. Unlocks at ${utcTime(Date.now() + seconds * 1000)} UTC.`,
            );
          } else if (error.status === 401) {
            const left = error.data?.triesLeft;
            name.setAttribute('aria-invalid', 'true');
            password.setAttribute('aria-invalid', 'true');
            signInBanner(
              'alert',
              'Wrong name or password.',
              Number.isInteger(left) && left > 0
                ? `${left} ${
                    left === 1 ? 'try' : 'tries'
                  } left before sign-in is locked for 5 minutes.`
                : 'Sign-in is locked for 5 minutes.',
            );
          } else if (error instanceof Offline) {
            signInBanner(
              'offline',
              'The server did not answer.',
              'Check that it runs, then try again.',
            );
          } else {
            signInBanner('alert', 'Not signed in.', error.message);
          }
        } finally {
          $('signin-button').disabled = false;
        }
      });

      if (window.matchMedia('(prefers-color-scheme: light)').matches) {
        $('root').dataset.theme = 'light';
      }

      api('GET', '/api/session').then(
        (session) => {
          showApp(session);
          refresh();
        },
        () => showSignIn(),
      );
    </script>
  </body>
</html>
